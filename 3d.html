// ---------- Modern weapons: rifle bullets, grenades and smoke ----------
let grenades = [];
let tracers = [];
let smoke = [];
const ray = new THREE.Ray();
const box3 = new THREE.Box3();
const headSphere = new THREE.Sphere();
const hitVector = new THREE.Vector3();
const tracerGeometry = new THREE.BoxGeometry(1, 1, 1);
const tracerMaterial = new THREE.MeshBasicMaterial({ color: new THREE.Color(6, 4.5, 2), toneMapped: false, transparent: true });

// Eyes are lower when crouching
function eyeHeight(p) {
  return 1.6 - 0.55 * (p.crouch || 0);
}

// Players with the mouse aim exactly. Everyone else (arrow keys, touch) gets help aiming up or down
// at the other soldier when they are roughly in front.
function aimPitch(p, other) {
  if (p === players[0] && mouseLocked()) return p.pitch;
  const dx = other.x - p.x, dz = other.z - p.z, dist = Math.hypot(dx, dz);
  const dir = forwardOf(p);
  if (!other.dead && (dx * dir.x + dz * dir.z) / (dist || 1) > 0.97) return Math.atan2(other.y + 1.15 - 0.45 * other.crouch - (p.y + eyeHeight(p)), dist);
  return p.pitch;
}

// How far a ray goes before it hits a wall, a crate, the ground or the edge of the arena
function rayDistance(origin, direction, maxDist) {
  let nearest = maxDist;
  ray.set(origin, direction);
  for (const b of platforms) {
    box3.min.set(b.x - b.w / 2, b.bottom || 0, b.z - b.d / 2);
    box3.max.set(b.x + b.w / 2, b.h, b.z + b.d / 2);
    if (ray.intersectBox(box3, hitVector)) nearest = Math.min(nearest, hitVector.distanceTo(origin));
  }
  if (direction.y < 0) nearest = Math.min(nearest, -origin.y / direction.y);
  for (const [o, d] of [[origin.x, direction.x], [origin.z, direction.z]]) {
    if (d > 0) nearest = Math.min(nearest, (ARENA - o) / d);
    if (d < 0) nearest = Math.min(nearest, (-ARENA - o) / d);
  }
  return nearest;
}

function addTracer(from, to) {
  const length = from.distanceTo(to);
  const mesh = new THREE.Mesh(tracerGeometry, tracerMaterial);
  mesh.position.copy(from).lerp(to, 0.5);
  mesh.scale.set(0.012, 0.012, length);
  mesh.lookAt(to);
  scene.add(mesh);
  tracers.push({ mesh, life: 0.05 });
}

function shoot(p, other) {
  p.ammo--;
  p.fireTimer = RIFLE_FIRE_TIME;
  p.recoil = 1;
  p.flash = 0.05;
  const moving = keys[p.controls.forward] || keys[p.controls.back];
  const spread = (moving ? 0.03 : 0.01) * (1 - 0.85 * p.aim) * (1 - 0.3 * p.crouch);
  const pitch = aimPitch(p, other) + (Math.random() - 0.5) * spread;
  const yaw = p.yaw + (Math.random() - 0.5) * spread;
  const origin = new THREE.Vector3(p.x, p.y + eyeHeight(p), p.z);
  const direction = new THREE.Vector3(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  let distance = rayDistance(origin, direction, 80);
  let hit = null;
  if (!other.dead) {
    ray.set(origin, direction);
    // Head first: a small ball on top. Then the body: a box from the knees to the shoulders.
    headSphere.center.set(other.x, other.y + 1.68 - 0.55 * other.crouch, other.z);
    headSphere.radius = 0.19;
    if (ray.intersectSphere(headSphere, hitVector) && hitVector.distanceTo(origin) < distance) {
      distance = hitVector.distanceTo(origin);
      hit = "head";
    }
    box3.min.set(other.x - 0.3, other.y + 0.05, other.z - 0.3);
    box3.max.set(other.x + 0.3, other.y + 1.48 - 0.5 * other.crouch, other.z + 0.3);
    if (ray.intersectBox(box3, hitVector) && hitVector.distanceTo(origin) < distance) {
      distance = hitVector.distanceTo(origin);
      hit = "body";
    }
  }
  const end = origin.clone().addScaledVector(direction, distance);
  // The bullet's glowing trail starts at the gun, a bit to the right and below your eyes
  const right = new THREE.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));
  const start = origin.clone().addScaledVector(direction, 0.7).addScaledVector(right, 0.13).add(new THREE.Vector3(0, -0.12, 0));
  addTracer(start, end);
  if (hit) {
    hurt(other, hit === "head" ? RIFLE_HEAD_DAMAGE : RIFLE_BODY_DAMAGE, p.x, p.z, hit === "head" ? 4 : 2.5, hit === "head" ? 14 : 7, end.y);
    if (hit === "head") p.headshot = 0.8;
  } else {
    // Dust and sparks where the bullet hits
    for (let i = 0; i < 6; i++) {
      addParticle(end.x, end.y, end.z, (Math.random() - 0.5) * 2, Math.random() * 2, (Math.random() - 0.5) * 2,
                  0.03 + Math.random() * 0.03, i < 2 ? "#ffe9a8" : "#8d8273", 0.4, 6);
    }
  }
}

function throwGrenade(p) {
  const dir = forwardOf(p);
  const pitch = p === players[0] && mouseLocked() ? p.pitch : 0.15;
  const mesh = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10), new THREE.MeshStandardMaterial({ color: "#3e4a2a", roughness: 0.6 }));
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.05, 8), new THREE.MeshStandardMaterial({ color: "#777", metalness: 0.8, roughness: 0.4 }));
  top.position.y = 0.08;
  body.castShadow = true;
  mesh.add(body, top);
  scene.add(mesh);
  grenades.push({
    mesh, owner: p, fuse: GRENADE_FUSE,
    x: p.x + dir.x * 0.5, y: p.y + 1.5, z: p.z + dir.z * 0.5,
    vx: dir.x * 11, vy: 4 + pitch * 9, vz: dir.z * 11
  });
}

function explodeGrenade(g) {
  const at = new THREE.Vector3(g.x, g.y, g.z);
  explode(at, true);
  explode(at.clone().add(new THREE.Vector3(0, 0.6, 0)), true);
  for (let i = 0; i < 6; i++) addSmoke(g.x + (Math.random() - 0.5), g.y + 0.3, g.z + (Math.random() - 0.5), 2.5, "#4a4743");
  for (const p of players) {
    const d = Math.hypot(p.x - g.x, p.y + 1 - g.y, p.z - g.z);
    if (d < GRENADE_RADIUS) {
      const power = 1 - d / GRENADE_RADIUS;
      hurt(p, Math.round(GRENADE_DAMAGE * power), g.x, g.z, 6 + power * 12, Math.round(10 + power * 20));
    }
    if (d < 14) p.shake = Math.max(p.shake, 0.45 * (1 - d / 14));
  }
}

const smokeTexture = (() => {
  const [c, g] = makeCanvas(64);
  const puff = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  puff.addColorStop(0, "rgba(255, 255, 255, 0.7)");
  puff.addColorStop(1, "rgba(255, 255, 255, 0)");
  g.fillStyle = puff;
  g.fillRect(0, 0, 64, 64);
  return toTexture(c, true);
})();

function addSmoke(x, y, z, size, color) {
  if (smoke.length > 80) return;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTexture, color, transparent: true, depthWrite: false, opacity: 0.6 }));
  sprite.position.set(x, y, z);
  sprite.scale.setScalar(size);
  scene.add(sprite);
  smoke.push({ sprite, life: 3 + Math.random() * 2, maxLife: 5, rise: 0.6 + Math.random() * 0.5, grow: size * 0.4 });
}

// ---------- Players ----------
function restart() {
  players.forEach((p, i) => {
    Object.assign(p, {
      x: 0, y: 0, z: i === 0 ? 15 : -15, vy: 0,
      yaw: i === 0 ? 0 : Math.PI,   // face each other
      pitch: 0,                     // looking up or down (only with the mouse)
      kx: 0, kz: 0,                 // knockback speed
      health: MAX_HEALTH, onGround: true, dead: false, deadTime: 0,
      swing: 0, swingCooldown: 0, fireCooldown: 0, walk: 0, hurt: 0, shake: 0,
      ammo: RIFLE_AMMO, reload: 0, fireTimer: 0, recoil: 0, flash: 0, headshot: 0,
      crouch: 0, aim: 0             // 0 = standing / not aiming, 1 = fully crouched / looking through the scope
    });
    p.model.rotation.set(0, 0, 0);
  });
  for (const list of [hearts, fireballs, explosions, grenades, tracers]) list.forEach(o => scene.remove(o.mesh || o));
  smoke.forEach(s => scene.remove(s.sprite));
  hearts = [];
  fireballs = [];
  explosions = [];
  grenades = [];
  tracers = [];
  smoke = [];
  particles = [];
  drops = [];
  splats = [];
  spawnHeart();
  spawnHeart();
  heartTimer = HEART_EVERY;
  winner = null;
  winnerTimer = 0;
  document.getElementById("message").style.display = "none";
}

// Move sideways, but not into walls or into the side of a platform
function tryMove(p, dx, dz) {
  for (const [mx, mz] of [[dx, 0], [0, dz]]) {   // one direction at a time, so you slide along walls
    const nx = Math.max(-ARENA + 0.5, Math.min(ARENA - 0.5, p.x + mx));
    const nz = Math.max(-ARENA + 0.5, Math.min(ARENA - 0.5, p.z + mz));
    if (!blockedAt(nx, nz, p.y)) { p.x = nx; p.z = nz; }
  }
}

// Getting hit: lose health, bleed, get knocked back (and a little up), and the screen shakes
function hurt(p, damage, fromX, fromZ, knockback, bloodAmount, bloodY = p.y + 1.3) {
  if (p.dead) return;
  p.health -= damage;
  p.hurt = 0.35;
  p.shake = 0.3;
  let dx = p.x - fromX, dz = p.z - fromZ;
  const len = Math.hypot(dx, dz) || 1;
  dx /= len;
  dz /= len;
  p.kx = dx * knockback;
  p.kz = dz * knockback;
  if (p.onGround) { p.vy = 4; p.onGround = false; }
  bleed(p.x, bloodY, p.z, dx, dz, bloodAmount);
}

function die(p) {
  p.dead = true;
  p.deadTime = 0;
  // A big burst of blood and a pool on the ground under the knight
  bleed(p.x, p.y + 1.2, p.z, 0, 0, 70);
  const floor = floorAt(p.x, p.z, p.y + 0.1);
  addSplat(p.x, floor + 0.015, p.z, 9);
  addSplat(p.x + 0.4, floor + 0.016, p.z + 0.3, 5);
}

function updatePlayer(p, other, dt) {
  const c = p.controls;
  p.hurt = Math.max(0, p.hurt - dt);
  p.shake = Math.max(0, p.shake - dt);
  if (p.dead) { p.deadTime += dt; return; }
  const dir = forwardOf(p);
  if (!CASTLE) {
    // Crouching and aiming happen smoothly over a fraction of a second. You cannot aim while reloading.
    const toward = (value, target, speed) => value < target ? Math.min(target, value + speed * dt) : Math.max(target, value - speed * dt);
    p.crouch = toward(p.crouch, keys[c.crouch] && p.onGround ? 1 : 0, 7);
    p.aim = toward(p.aim, keys[c.aim] && p.reload <= 0 ? 1 : 0, 7);
  }
  // Crouching and aiming make you walk slower
  const slow = (1 - 0.55 * p.crouch) * (1 - 0.45 * p.aim);
  // With the mouse, A and D step sideways (the mouse turns). Without it, A/D and ←/→ turn.
  // On a phone you look around by dragging, so the joystick steps sideways too
  const strafe = (p === players[0] && mouseLocked()) || isPhone;
  let side = 0;
  if (strafe) {
    if (keys[c.left]) side -= 1;
    if (keys[c.right]) side += 1;
  } else {
    if (keys[c.left]) p.yaw += TURN_SPEED * dt;
    if (keys[c.right]) p.yaw -= TURN_SPEED * dt;
  }
  let move = 0;
  if (keys[c.forward]) move += 1;
  if (keys[c.back]) move -= 0.6;
  if (p.stick) {
    // Joystick: push up to walk forward, sideways to step sideways, as far as you push it
    side = p.stick.x;
    move = -p.stick.y * (p.stick.y > 0 ? 0.6 : 1);
  }
  if (move || side) {
    // (-dir.z, dir.x) points to the right of where you look
    const dx = dir.x * move - dir.z * side * 0.8;
    const dz = dir.z * move + dir.x * side * 0.8;
    tryMove(p, dx * WALK_SPEED * slow * dt, dz * WALK_SPEED * slow * dt);
    p.walk += dt * 9;
  }

  // Knockback slides you away and slows down quickly
  if (p.kx || p.kz) {
    tryMove(p, p.kx * dt, p.kz * dt);
    const slow = Math.exp(-6 * dt);
    p.kx *= slow;
    p.kz *= slow;
    if (Math.abs(p.kx) + Math.abs(p.kz) < 0.05) p.kx = p.kz = 0;
  }

  // Jumping and falling, landing on the ground or on top of platforms.
  // In a waterfall you swim instead: hold jump to swim up, let go to sink slowly.
  if (keys[c.jump] && p.onGround && p.crouch < 0.5) { p.vy = JUMP_SPEED; p.onGround = false; }
  const prevY = p.y;
  if (inWaterfall(p)) p.vy = keys[c.jump] ? SWIM_SPEED : -SINK_SPEED;
  else p.vy -= GRAVITY * dt;
  p.y += p.vy * dt;
  p.onGround = false;
  const floor = floorAt(p.x, p.z, prevY);
  if (p.y <= floor) { p.y = floor; p.vy = 0; p.onGround = true; }

  // Lava: hurts and throws you up in the air
  if (p.y === 0 && onLava(p.x, p.z)) {
    p.health -= LAVA_DAMAGE;
    p.hurt = 0.35;
    p.shake = 0.25;
    p.vy = 10;
    p.onGround = false;
    explode(new THREE.Vector3(p.x, 0.3, p.z), false);
  }

  p.fireCooldown = Math.max(0, p.fireCooldown - dt);
  if (!CASTLE) {
    // Rifle: hold the trigger to keep firing. When the magazine is empty it reloads by itself.
    p.fireTimer -= dt;
    p.recoil = Math.max(0, p.recoil - dt * 10);
    p.flash = Math.max(0, p.flash - dt);
    p.headshot = Math.max(0, p.headshot - dt);
    if (p.reload > 0) {
      p.reload -= dt;
      if (p.reload <= 0) p.ammo = RIFLE_AMMO;
    } else if (p.ammo === 0) {
      p.reload = RELOAD_TIME;
    } else if (keys[c.attack] && p.fireTimer <= 0) {
      shoot(p, other);
    }
    // Grenade, with a cooldown so you can't spam it
    if ((keys[c.fire] || keys[c.fire2]) && p.fireCooldown === 0) {
      throwGrenade(p);
      p.fireCooldown = GRENADE_COOLDOWN;
    }
    return;
  }

  // Sword: hits the other knight if they are close and in front of you
  p.swingCooldown -= dt;
  if (keys[c.attack] && p.swingCooldown <= 0) {
    p.swing = 0.3;
    p.swingCooldown = 0.5;
    const dx = other.x - p.x, dz = other.z - p.z;
    const dist = Math.hypot(dx, dz);
    const inFront = (dx * dir.x + dz * dir.z) / (dist || 1) > 0.5;
    if (dist < SWORD_REACH && inFront && Math.abs(other.y - p.y) < 1.5) {
      hurt(other, SWORD_DAMAGE, p.x, p.z, SWORD_KNOCKBACK, 16);
      // Sparks where steel meets steel
      for (let i = 0; i < 8; i++) {
        addParticle(other.x, other.y + 1.3, other.z, (Math.random() - 0.5) * 6, Math.random() * 4, (Math.random() - 0.5) * 6,
                    0.025, "#fff2b0", 0.3, 15);
      }
    }
  }
  p.swing = Math.max(0, p.swing - dt);

  // Fireball, with a cooldown so you can't spam it
  if ((keys[c.fire] || keys[c.fire2]) && p.fireCooldown === 0) {
    shootFireball(p);
    p.fireCooldown = FIREBALL_COOLDOWN;
  }
}

// The knights can't walk through each other
function separate(a, b) {
  if (a.dead || b.dead) return;
  const dx = b.x - a.x, dz = b.z - a.z;
  const dist = Math.hypot(dx, dz);
  if (dist < 1 && dist > 0 && Math.abs(a.y - b.y) < 1.5) {
    const push = (1 - dist) / 2;
    tryMove(a, -dx / dist * push, -dz / dist * push);
    tryMove(b, dx / dist * push, dz / dist * push);
  }
}

const matrix = new THREE.Matrix4();
const quaternion = new THREE.Quaternion();
const scaleVector = new THREE.Vector3();
const positionVector = new THREE.Vector3();
const upAxis = new THREE.Vector3(0, 1, 0);

function updateWorld(dt, time) {
  // Fireballs fly straight, spit embers, and explode on the other knight or a wall
  for (const f of fireballs) {
    f.mesh.position.x += f.dir.x * FIREBALL_SPEED * dt;
    f.mesh.position.z += f.dir.z * FIREBALL_SPEED * dt;
    f.life -= dt;
    const pos = f.mesh.position;
    for (let i = 0; i < 2; i++) {
      addParticle(pos.x, pos.y, pos.z, (Math.random() - 0.5), Math.random() * 1.5, (Math.random() - 0.5),
                  0.06 + Math.random() * 0.06, Math.random() < 0.5 ? "#ffb347" : "#ff5a00", 0.35, -1);
    }
    const target = players.find(p => p !== f.owner);
    const hitKnight = !target.dead && Math.hypot(pos.x - target.x, pos.z - target.z) < 0.8 && pos.y > target.y && pos.y < target.y + 2.2;
    const hitWall = Math.abs(pos.x) > ARENA || Math.abs(pos.z) > ARENA ||
                    platforms.some(p => insidePlatform(p, pos.x, pos.z, 0) && pos.y < p.h && pos.y > (p.bottom || 0));
    if (hitKnight) hurt(target, FIREBALL_DAMAGE, pos.x - f.dir.x, pos.z - f.dir.z, FIREBALL_KNOCKBACK, 22);
    if (hitKnight || hitWall || f.life <= 0) {
      explode(pos);
      scene.remove(f.mesh);
      f.done = true;
    }
  }
  fireballs = fireballs.filter(f => !f.done);

  // Explosions grow, fade and their light dies down
  for (const e of explosions) {
    e.time += dt;
    e.mesh.scale.setScalar(1 + e.time * 6);
    e.mesh.material.opacity = Math.max(0, 1 - e.time * 2.5);
    e.flash.intensity *= Math.exp(-10 * dt);
    if (e.time > 0.4) { scene.remove(e.mesh); e.done = true; }
  }
  explosions = explosions.filter(e => !e.done);

  // Hearts spin, bob, and heal whoever walks into them
  heartTimer -= dt;
  if (heartTimer <= 0) {
    if (hearts.length < MAX_HEARTS) spawnHeart();
    heartTimer = HEART_EVERY;
  }
  for (const h of hearts) {
    h.rotation.y = time * 2;
    h.position.y = 0.9 + Math.sin(time * 3 + h.position.x) * 0.15;
    for (const p of players) {
      if (!h.taken && !p.dead && Math.hypot(p.x - h.position.x, p.z - h.position.z) < 1 && p.y < 1.5) {
        p.health = Math.min(MAX_HEALTH, p.health + (CASTLE ? HEART_HEAL : MEDKIT_HEAL));
        h.taken = true;
        scene.remove(h);
        for (let i = 0; i < 12; i++) {
          addParticle(h.position.x, h.position.y, h.position.z, (Math.random() - 0.5) * 3, Math.random() * 3,
                      (Math.random() - 0.5) * 3, 0.04, CASTLE ? "#ff7aa0" : "#9dff9d", 0.6, 4);
        }
      }
    }
  }
  hearts = hearts.filter(h => !h.taken);

  // Grenades fly in an arc, bounce off the ground and walls, and go off when the fuse runs out
  for (const g of grenades) {
    const prevY = g.y;
    g.vy -= 20 * dt;
    const nx = g.x + g.vx * dt, nz = g.z + g.vz * dt;
    const hitsSide = Math.abs(nx) > ARENA - 0.3 || Math.abs(nz) > ARENA - 0.3 ||
                     platforms.some(p => insidePlatform(p, nx, nz, 0.05) && g.y < p.h && g.y > (p.bottom || 0));
    if (hitsSide) { g.vx *= -0.4; g.vz *= -0.4; } else { g.x = nx; g.z = nz; }
    g.y += g.vy * dt;
    const floor = floorAt(g.x, g.z, prevY) + 0.075;
    if (g.y <= floor) { g.y = floor; g.vy = Math.abs(g.vy) * 0.35; g.vx *= 0.6; g.vz *= 0.6; }
    g.mesh.position.set(g.x, g.y, g.z);
    g.mesh.rotation.x += dt * 8;
    g.fuse -= dt;
    if (g.fuse <= 0) { explodeGrenade(g); scene.remove(g.mesh); g.done = true; }
  }
  grenades = grenades.filter(g => !g.done);
  for (const t of tracers) {
    t.life -= dt;
    if (t.life <= 0) { scene.remove(t.mesh); t.done = true; }
  }
  tracers = tracers.filter(t => !t.done);
  // Smoke rises, spreads out and fades
  if (Math.random() < dt * 4) {
    for (const s of smokeSources) addSmoke(s.x + (Math.random() - 0.5) * 0.6, s.y, s.z + (Math.random() - 0.5) * 0.6, 1.2, "#3b3936");
  }
  for (const s of smoke) {
    s.life -= dt;
    s.sprite.position.y += s.rise * dt;
    s.sprite.scale.addScalar(s.grow * dt);
    s.sprite.material.opacity = Math.max(0, 0.55 * Math.min(1, s.life / 2));
    if (s.life <= 0) { scene.remove(s.sprite); s.sprite.material.dispose(); s.done = true; }
  }
  smoke = smoke.filter(s => !s.done);

  // Lava spits sparks, waterfalls spray at the bottom, torches flicker
  for (const pool of lavaPools) {
    if (Math.random() < dt * 14) {
      addParticle(pool.x + (Math.random() - 0.5) * pool.w, 0.1, pool.z + (Math.random() - 0.5) * pool.d,
                  (Math.random() - 0.5) * 0.6, 1.5 + Math.random() * 2, (Math.random() - 0.5) * 0.6,
                  0.035, Math.random() < 0.5 ? "#ffcc55" : "#ff6a00", 1 + Math.random(), 0.8);
    }
  }
  for (const w of waterfalls) {
    if (Math.random() < dt * 25) {
      const along = (Math.random() - 0.5) * w.width;
      const px = w.along === "x" ? w.x + along : w.x - Math.sign(w.x) * 0.3;
      const pz = w.along === "x" ? w.z - Math.sign(w.z) * 0.3 : w.z + along;
      addParticle(px, 0.15, pz, (Math.random() - 0.5) * 1.5, 1 + Math.random() * 1.5, (Math.random() - 0.5) * 1.5,
                  0.05 + Math.random() * 0.05, "#e6f3ff", 0.6, 6);
    }
  }
  flames.forEach((f, i) => { f.scale.set(1, 0.8 + Math.sin(time * 15 + i * 7) * 0.2 + Math.random() * 0.12, 1); });
  clouds.forEach((c, i) => { c.position.x += dt * (0.6 + (i % 3) * 0.3); if (c.position.x > 300) c.position.x = -300; });

  // Move and draw all the small particles
  for (const q of particles) {
    q.life -= dt;
    q.vy -= q.gravity * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.z += q.vz * dt;
  }
  particles = particles.filter(q => q.life > 0 && q.y > -0.5);
  particles.forEach((q, i) => {
    const s = q.size * Math.max(0.1, q.life / q.maxLife);
    matrix.compose(positionVector.set(q.x, q.y, q.z), quaternion.identity(), scaleVector.set(s, s, s));
    particleMesh.setMatrixAt(i, matrix);
    particleMesh.setColorAt(i, q.color);
  });
  particleMesh.count = particles.length;
  particleMesh.instanceMatrix.needsUpdate = true;
  if (particleMesh.instanceColor) particleMesh.instanceColor.needsUpdate = true;

  // Blood drops fall and leave splats where they land
  for (const d of drops) {
    d.vy -= 15 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.z += d.vz * dt;
    const floor = floorAt(d.x, d.z, d.y - d.vy * dt);
    if (d.y <= floor) {
      if (Math.abs(d.x) < ARENA && Math.abs(d.z) < ARENA) addSplat(d.x, floor + 0.012, d.z, 0.4 + Math.random() * 1.1);
      d.done = true;
    }
  }
  drops = drops.filter(d => !d.done);
  drops.forEach((d, i) => {
    matrix.makeTranslation(d.x, d.y, d.z);
    dropMesh.setMatrixAt(i, matrix);
  });
  dropMesh.count = drops.length;
  dropMesh.instanceMatrix.needsUpdate = true;
  for (const s of splats) s.life -= dt;
  splats = splats.filter(s => s.life > 0);
  splats.forEach((s, i) => {
    const fade = Math.min(1, s.life / 2);   // shrinks away in the last two seconds
    quaternion.setFromAxisAngle(upAxis, s.angle);
    matrix.compose(positionVector.set(s.x, s.y, s.z), quaternion, scaleVector.set(s.size * fade, 1, s.size * fade * 0.8));
    splatMesh.setMatrixAt(i, matrix);
  });
  splatMesh.count = splats.length;
  splatMesh.instanceMatrix.needsUpdate = true;

  // Moving water, slowly flowing and flickering lava, grass in the wind
  wind.value = time;
  if (CASTLE) {
    waterTexture.offset.y += dt * 1.6;
    lavaTexture.offset.x += dt * 0.025;
    lavaTexture.offset.y += dt * 0.015;
    lavaMaterial.emissiveIntensity = 3 + Math.sin(time * 3) * 0.5;
    lavaLights.forEach((l, i) => { l.intensity = 35 + Math.sin(time * 5 + i) * 8; });
  }
}

// Soldier animation: legs walk, the upper body leans with where you look, the rifle kicks back
function animateSoldier(p, time) {
  const { upper, rifle, flash } = p.model.userData;
  upper.rotation.x = p.pitch * 0.5 - p.crouch * 0.15;   // lean forward a little when crouching
  upper.position.y = 0.92 + Math.abs(Math.sin(p.walk)) * 0.02 + Math.sin(time * 1.5) * 0.005;   // breathing
  rifle.position.z = -0.22 + p.recoil * 0.05;
  rifle.rotation.x = p.reload > 0 ? -0.6 : 0;   // tipped down while reloading
  flash.visible = p.flash > 0;
  flash.material.rotation = Math.random() * Math.PI;
  // First-person rifle: kicks back when firing, dips while reloading, sways when walking
  const view = p.viewSword;
  const reloadDip = p.reload > 0 ? Math.sin(Math.min(1, (RELOAD_TIME - p.reload) / RELOAD_TIME) * Math.PI) : 0;
  // Aiming brings the rifle up to the middle of your view; when it is all the way up you look through the scope
  view.position.set(0.12 * (1 - p.aim), -0.13 + 0.06 * p.aim - reloadDip * 0.1 + Math.sin(p.walk * 2) * 0.003 * (1 - p.aim),
                    -0.3 + p.recoil * 0.03);
  view.rotation.set(p.recoil * 0.06 * (1 - 0.7 * p.aim) - reloadDip * 0.5, 0, reloadDip * 0.4);
  view.visible = !p.dead && p.aim < 0.9;
  p.hud.querySelector(".scope").style.opacity = Math.max(0, (p.aim - 0.6) / 0.4);
  p.hud.querySelector(".crosshair").style.opacity = p.aim > 0.3 ? 0 : 1;
  view.userData.flash.visible = p.flash > 0;
  view.userData.flash.material.rotation = Math.random() * Math.PI;
  view.userData.flashLight.intensity = p.flash > 0 ? 8 : 0;
  // Ammo counter and headshot message
  p.hud.querySelector(".ammo").textContent = p.reload > 0 ? "Reloading..." : p.ammo + " / " + RIFLE_AMMO;
  p.hud.querySelector(".headshot").style.opacity = p.headshot > 0 ? 1 : 0;
}

// Put each knight's model and camera where the player is, and animate them
function placePlayer(p, time) {
  const m = p.model;
  m.position.set(p.x, p.y, p.z);
  const { legL, legR, swordArm, cape, head } = m.userData;
  p.hud.querySelector(".fire div").style.width = (1 - p.fireCooldown / (CASTLE ? FIREBALL_COOLDOWN : GRENADE_COOLDOWN)) * 100 + "%";
  p.hud.querySelector(".health div").style.width = Math.max(0, p.health) + "%";
  p.hud.querySelector(".hit").style.opacity = p.hurt > 0 || p.dead ? 1 : 0;
  if (p.dead) {
    // Fall over backwards
    const fall = Math.min(1, p.deadTime / 0.6);
    m.rotation.set(fall * fall * Math.PI / 2, p.yaw, 0);
  } else {
    m.rotation.set(0, p.yaw, 0);
  }
  // Walking: legs swing from the hip and the knee bends; the head bobs a little
  const step = Math.sin(p.walk);
  legL.hip.rotation.x = step * 0.6;
  legR.hip.rotation.x = -step * 0.6;
  legL.knee.rotation.x = -Math.max(0, -step) * 0.9;
  legR.knee.rotation.x = -Math.max(0, step) * 0.9;
  if (!CASTLE && p.crouch > 0) {
    // Crouching: drop the body and fold the legs (thighs forward, shins back)
    m.position.y = p.y - 0.45 * p.crouch;
    for (const leg of [legL, legR]) {
      leg.hip.rotation.x += (1.2 - leg.hip.rotation.x) * p.crouch;
      leg.knee.rotation.x += (-1.9 - leg.knee.rotation.x) * p.crouch;
    }
  }
  placeCamera(p);
  if (!CASTLE) { animateSoldier(p, time); return; }
  head.position.y = 1.66 + Math.abs(step) * 0.015;
  // Sword arm: resting forward, or a chop from high above down to the front
  if (p.swing > 0) {
    const t = 1 - p.swing / 0.3;
    swordArm.shoulder.rotation.x = 2.2 - t * t * 2.7;
  } else {
    swordArm.shoulder.rotation.x = 0.4 + Math.sin(time * 2) * 0.03;
  }
  swordArm.elbow.rotation.x = 0.9;
  // The cape waves more when you walk
  const positions = cape.geometry.attributes.position;
  const rest = cape.userData.rest;
  const moving = Math.min(1, Math.abs(Math.sin(p.walk * 0.5)) + 0.2);
  for (let i = 0; i < positions.count; i++) {
    const down = -rest[i * 3 + 1];   // 0 at the shoulders, 1.15 at the bottom
    positions.array[i * 3 + 2] = rest[i * 3 + 2] + down * down * (0.12 + moving * 0.12) * (1 + Math.sin(time * 5 + down * 4) * 0.2);
  }
  positions.needsUpdate = true;
  // The sword in your own view swings down when you attack, and sways a little when walking
  const chop = p.swing > 0 ? Math.sin((1 - p.swing / 0.3) * Math.PI) : 0;
  p.viewSword.rotation.x = -0.85 - chop * 1.2;
  p.viewSword.position.y = -0.2 + Math.sin(p.walk * 2) * 0.004;
}

// Camera at eye height. When hit it shakes, and when dead it drops to the ground and tips over.
function placeCamera(p) {
  const shake = p.shake * 0.25;
  if (p.dead) {
    const fall = Math.min(1, p.deadTime / 0.6);
    p.camera.position.set(p.x, p.y + 1.7 - fall * 1.4, p.z);
    p.camera.rotation.set(-fall * 0.6, p.yaw, fall * 0.9, "YXZ");
  } else {
    p.camera.position.set(p.x + (Math.random() - 0.5) * shake, p.y + 1.7 - 0.55 * (p.crouch || 0) + (Math.random() - 0.5) * shake,
                          p.z + (Math.random() - 0.5) * shake);
    p.camera.rotation.set(p.pitch, p.yaw, 0, "YXZ");   // turn first, then look up or down
  }
  const fov = 70 - (70 - AIM_FOV) * (p.dead ? 0 : p.aim || 0);
  if (p.camera.fov !== fov) {
    p.camera.fov = fov;
    p.camera.updateProjectionMatrix();
  }
  p.viewSword.visible = !p.dead;
}

// ---------- Drawing: two halves of the screen, one camera each ----------
// On computers each half also gets a "glow" effect (bloom), so fire, lava and torches shine.
const useGlow = !isPhone;
const composers = players.map(p => {
  if (!useGlow) return null;
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, p.camera));
  // Only really bright things glow (threshold 2): fire, lava and torch flames, not shiny armor
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), 0.6, 0.4, 2));
  composer.addPass(new OutputPass());
  return composer;
});

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  players.forEach((p, i) => {
    p.camera.aspect = (innerWidth / 2) / innerHeight;
    p.camera.updateProjectionMatrix();
    if (composers[i]) {
      composers[i].setPixelRatio(renderer.getPixelRatio());
      composers[i].setSize(innerWidth / 2, innerHeight);
    }
  });
}
addEventListener("resize", resize);
resize();
restart();
document.getElementById("loading").style.display = "none";

const clock = new THREE.Clock();
// One step of the game: move everyone, fight, and update the world
let gameTime = 0;
function step(dt) {
  gameTime += dt;
  const time = gameTime;
  if (!winner) {
    updatePlayer(players[0], players[1], dt);
    updatePlayer(players[1], players[0], dt);
    separate(players[0], players[1]);
    const loser = players.find(p => p.health <= 0 && !p.dead);
    if (loser) die(loser);
    const dead = players.find(p => p.dead);
    if (dead && dead.deadTime > 1.2) {
      winner = players.find(p => p !== dead).name;
      const message = document.getElementById("message");
      message.querySelector("h1").textContent = winner + " wins!";
      message.style.display = "flex";
    }
  } else {
    players.forEach(p => { if (p.dead) p.deadTime += dt; });
  }
  updateWorld(dt, time);
  players.forEach(p => placePlayer(p, time));
}

function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);
  const half = innerWidth / 2;
  renderer.setScissorTest(true);
  players.forEach((p, i) => {
    renderer.setViewport(i * half, 0, half, innerHeight);
    renderer.setScissor(i * half, 0, half, innerHeight);
    if (composers[i]) composers[i].render(dt);
    else renderer.render(scene, p.camera);
  });
  requestAnimationFrame(loop);
}
loop();

// Handy for testing in the browser console
window.game = {
  players, restart, keys, platforms, mode: MODE, get grenades() { return grenades; },
  // Run the game for a number of seconds without drawing (for testing)
  run(seconds) { for (let t = 0; t < seconds; t += 1 / 60) step(1 / 60); },
  get hearts() { return hearts; }, get fireballs() { return fireballs; }, get winner() { return winner; },
  get blood() { return { drops: drops.length, splats: splats.length }; }
};
</script>
