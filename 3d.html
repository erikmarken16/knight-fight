<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Knight Fight 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; color: #fff; font-family: sans-serif; }
    canvas { display: block; }
    /* Each player's half of the screen gets its own health bars and crosshair */
    .hud { position: fixed; top: 0; width: 50%; height: 100%; pointer-events: none; }
    #hud1 { left: 0; }
    #hud2 { right: 0; }
    .name { position: absolute; top: 14px; left: 16px; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 3px #000; }
    .bar { position: absolute; left: 16px; width: 260px; border-radius: 10px; background: rgba(0, 0, 0, 0.5); overflow: hidden; }
    .bar div { height: 100%; border-radius: 10px; }
    .health { top: 46px; height: 20px; }
    .health div { background: linear-gradient(#5ef08a, #1e9e4f); }
    .fire { top: 72px; height: 8px; width: 160px; }
    .fire div { background: linear-gradient(#ffcf4a, #ff6a00); }
    .crosshair { position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; margin: -9px; }
    .crosshair::before, .crosshair::after { content: ""; position: absolute; background: rgba(255, 255, 255, 0.8); }
    .crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
    .crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }
    /* Red edges of the screen when you get hit */
    .hit { position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s;
           background: radial-gradient(ellipse at center, rgba(160, 0, 0, 0) 45%, rgba(160, 0, 0, 0.65) 100%); }
    .ammo { position: absolute; right: 20px; bottom: 40px; font-size: 26px; font-weight: bold; text-shadow: 2px 2px 3px #000; }
    /* Looking through the scope: black around a round lens, thin cross lines and a red dot */
    .name, .bar, .ammo, .headshot { z-index: 2; }   /* stay visible on top of the scope */
    .scope { position: absolute; inset: 0; opacity: 0; pointer-events: none; z-index: 1;
             background: radial-gradient(circle closest-side, rgba(0, 0, 0, 0) 88%, rgba(0, 0, 0, 0.6) 92%, #000 95%); }
    .reticle { position: absolute; left: 50%; top: 50%; width: 70vmin; height: 70vmin; transform: translate(-50%, -50%); }
    .reticle::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px; margin-left: -0.75px;
                       background: linear-gradient(#000 0 42%, transparent 42% 58%, #000 58%); }
    .reticle::after { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1.5px; margin-top: -0.75px;
                      background: linear-gradient(90deg, #000 0 42%, transparent 42% 58%, #000 58%); }
    .scope::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%;
                    background: #ff2a2a; box-shadow: 0 0 6px 2px rgba(255, 40, 40, 0.8); }
    .headshot { position: absolute; top: 38%; width: 100%; text-align: center; font-size: 30px; font-weight: bold;
                color: #ff4a3a; text-shadow: 2px 2px 3px #000; opacity: 0; transition: opacity 0.2s; }
    #mouseHint { position: absolute; left: 50%; top: 60%; transform: translateX(-50%); display: flex;
                 padding: 10px 18px; border-radius: 10px; background: rgba(0, 0, 0, 0.55); font-size: 18px; white-space: nowrap; }
    #divider { position: fixed; top: 0; left: 50%; width: 4px; height: 100%; margin-left: -2px; background: #111; }
    #help { position: fixed; bottom: 8px; width: 100%; text-align: center; font-size: 14px; text-shadow: 1px 1px 2px #000; }
    #message { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
               background: rgba(0, 0, 0, 0.6); text-align: center; }
    #message h1 { font-size: 64px; margin: 0; color: #ffd84d; text-shadow: 3px 3px 4px #000; }
    #message p { font-size: 22px; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #111; font-size: 24px; }
    /* Touch buttons for phones: each player's buttons are on their own half of the screen */
    html { touch-action: manipulation; }
    #touch { display: none; }
    /* Each player's half of the screen: drag anywhere to look around, joystick near the outer edge */
    .touchHalf { position: fixed; top: 0; bottom: 0; width: 50%; touch-action: none; }
    .touchHalf.p1 { left: 0; }
    .touchHalf.p2 { right: 0; }
    .stickBase { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
                 background: rgba(0, 0, 0, 0.25); border: 2px solid rgba(255, 255, 255, 0.45); opacity: 0.45; pointer-events: none; }
    .stickBase.active { opacity: 1; }
    .stickKnob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%;
                 background: rgba(255, 255, 255, 0.55); }
    /* Big jump and attack buttons in the corner towards the middle, smaller ones in an arc around them */
    .btns { position: absolute; bottom: 10px; width: 210px; height: 170px; pointer-events: none; }
    .p1 .btns { right: 10px; }
    .p2 .btns { left: 10px; }
    .btns .tb { position: absolute; pointer-events: auto; }
    .btns .big { width: 70px; height: 70px; font-size: 30px; }
    .tb { width: 50px; height: 50px; padding: 0; border-radius: 50%; font-size: 20px; color: #fff;
          background: rgba(0, 0, 0, 0.35); border: 2px solid rgba(255, 255, 255, 0.7);
          touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .p1 .tb { border-color: rgba(231, 76, 60, 0.9); }
    .p2 .tb { border-color: rgba(52, 152, 219, 0.9); }
    .tb:active { background: rgba(255, 255, 255, 0.4); }
    #topButtons { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px; }
    #topButtons .tb { width: 40px; height: 40px; font-size: 18px; border-color: rgba(255, 255, 255, 0.7); }
    #turnPhone { display: none; }
    @media (pointer: coarse) {
      #touch { display: block; }
      #help { display: none; }
      #mouseHint { display: none !important; }   /* phones have no mouse */
      .name { font-size: 16px; top: 8px; }
      .bar { width: 160px; }
      .health { top: 32px; height: 14px; }
      .fire { top: 52px; width: 100px; }
      .ammo { font-size: 16px; bottom: auto; top: 62px; right: auto; left: 16px; }   /* under the health bars */
      #message h1 { font-size: 40px; }
    }
    @media (pointer: coarse) and (orientation: portrait) {
      #turnPhone { display: flex; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
                   background: #222; font-size: 24px; padding: 20px; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="hud1" class="hud">
    <div class="hit"></div>
    <div id="mouseHint">Player 1: click here to play with the mouse</div>
    <div class="name">Player 1</div>
    <div class="bar health"><div></div></div>
    <div class="bar fire"><div></div></div>
    <div class="crosshair"></div>
    <div class="ammo"></div>
    <div class="headshot">HEADSHOT!</div>
    <div class="scope"><div class="reticle"></div></div>
  </div>
  <div id="hud2" class="hud">
    <div class="hit"></div>
    <div class="name">Player 2</div>
    <div class="bar health"><div></div></div>
    <div class="bar fire"><div></div></div>
    <div class="crosshair"></div>
    <div class="ammo"></div>
    <div class="headshot">HEADSHOT!</div>
    <div class="scope"><div class="reticle"></div></div>
  </div>
  <div id="divider"></div>
  <div id="help"></div>
  <div id="message"><h1></h1><p>Press R (or ↻) to play again, Esc (or ☰) for the menu</p></div>
  <div id="touch"></div>
  <div id="turnPhone">Turn your phone sideways to play</div>
  <div id="loading">Building the battlefield...</div>

<!-- three.js draws the 3D world. The import map tells the browser where "three" is. -->
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { Sky } from "three/addons/objects/Sky.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// ---------- Settings ----------
const ARENA = 20;            // the arena goes from -20 to 20 on both sides
const WALK_SPEED = 6;
const TURN_SPEED = 2.6;      // radians per second
const GRAVITY = 22;
const JUMP_SPEED = 8.5;
const MAX_HEALTH = 100;
const SWORD_DAMAGE = 10;
const SWORD_REACH = 2.4;
const SWORD_KNOCKBACK = 9;    // how hard a sword hit pushes you away
const FIREBALL_DAMAGE = 15;
const FIREBALL_KNOCKBACK = 12;
const FIREBALL_SPEED = 18;
const FIREBALL_COOLDOWN = 2;  // seconds
const LAVA_DAMAGE = 8;
const HEART_HEAL = 15;
const HEART_EVERY = 10;       // seconds
const MAX_HEARTS = 4;
const SWIM_SPEED = 3;
const SINK_SPEED = 1.5;
const WATERFALL_TOP = 5.2;    // a little above the ledges, so you can climb out
const LEDGE_HEIGHT = 4.5;     // too high to jump to: swim up a waterfall

// Player 1 plays like most computer games: WASD to move, the mouse to look, left click for the sword,
// right click (or E) for a fireball, Space to jump. "Mouse0"/"Mouse2" are the left and right mouse buttons.
// Player 2 uses the arrow keys. On a phone the touch buttons press these same "keys".
const CONTROLS = [
  { forward: "KeyW", back: "KeyS", left: "KeyA", right: "KeyD", jump: "Space", attack: "Mouse0", fire: "KeyE", fire2: "Mouse2",
    aim: "Mouse2", crouch: "KeyC" },
  { forward: "ArrowUp", back: "ArrowDown", left: "ArrowLeft", right: "ArrowRight", jump: "Slash", attack: "Enter", fire: "ShiftRight",
    aim: "Period", crouch: "Comma" }
];
const MOUSE_SPEED = 0.0025;

// Phones get a lighter version (smaller textures, fewer grass blades, no glow effect) so they run smoothly
const isPhone = matchMedia("(pointer: coarse)").matches;
const TEXTURE_SIZE = isPhone ? 256 : 512;

// Which 3D game: "castle" (knights with swords and fireballs) or "modern" (soldiers with rifles and grenades)
const MODE = new URLSearchParams(location.search).get("mode") === "modern" ? "modern" : "castle";
const CASTLE = MODE === "castle";

// Modern weapons
const RIFLE_BODY_DAMAGE = 12;
const RIFLE_HEAD_DAMAGE = 34;      // headshots hurt almost three times as much
const RIFLE_FIRE_TIME = 0.11;      // seconds between shots while holding the trigger
const RIFLE_AMMO = 30;
const RELOAD_TIME = 1.6;
const GRENADE_COOLDOWN = 4;
const GRENADE_FUSE = 1.8;          // seconds until it goes off
const GRENADE_RADIUS = 4.5;
const GRENADE_DAMAGE = 55;         // right next to it; less further away
const MEDKIT_HEAL = 25;
const AIM_FOV = 28;          // zoomed in view through the scope (normal is 70)
// In the modern mode the right mouse button aims through the scope, so player 1 throws grenades with E or G instead
if (!CASTLE) CONTROLS[0].fire2 = "KeyG";

const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "KeyR") restart();
  // Esc first lets go of the mouse; only go to the menu if the mouse wasn't just let go
  if (e.code === "Escape" && !document.pointerLockElement && performance.now() - mouseReleasedAt > 500) location.href = "index.html";
  // Stop space, arrows and "/" from scrolling the page or opening quick find
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Slash", "Enter"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.code] = false; });

// ---------- Mouse for player 1 ----------
// Clicking the game "locks" the mouse to it: the pointer disappears and moving the mouse turns and looks around.
let mouseReleasedAt = 0;

function mouseLocked() {
  return document.pointerLockElement === renderer.domElement;
}

addEventListener("mousedown", e => {
  if (!mouseLocked()) {
    if (!isPhone) renderer.domElement.requestPointerLock();
    return;   // the click that grabs the mouse doesn't swing the sword
  }
  keys["Mouse" + e.button] = true;
});
addEventListener("mouseup", e => { keys["Mouse" + e.button] = false; });
addEventListener("contextmenu", e => e.preventDefault());   // right click is the fireball, not a menu
addEventListener("mousemove", e => {
  if (!mouseLocked()) return;
  const p = players[0];
  const speed = MOUSE_SPEED * (1 - 0.6 * (p.aim || 0));   // slower while looking through the scope
  p.yaw -= e.movementX * speed;
  p.pitch = Math.max(-1.2, Math.min(1.2, p.pitch - e.movementY * speed));
});
document.addEventListener("pointerlockchange", () => {
  if (!mouseLocked()) {
    mouseReleasedAt = performance.now();
    keys.Mouse0 = keys.Mouse2 = false;
  }
  document.getElementById("mouseHint").style.display = mouseLocked() || isPhone ? "none" : "flex";
});

// ---------- Touch buttons for phones ----------
// Holding a button is the same as holding down its key, so the game code doesn't need to know about touch.
function touchButton(label, onDown, onUp) {
  const b = document.createElement("button");
  b.className = "tb";
  b.textContent = label;
  b.addEventListener("pointerdown", e => { e.preventDefault(); onDown(); });
  for (const type of ["pointerup", "pointercancel", "pointerleave"]) {
    b.addEventListener(type, e => { e.preventDefault(); if (onUp) onUp(); });
  }
  b.addEventListener("contextmenu", e => e.preventDefault());
  return b;
}

function holdKey(label, code) {
  return touchButton(label, () => { keys[code] = true; }, () => { keys[code] = false; });
}

// Phone controls like Roblox Rivals, one set on each player's half of the screen:
// - put your thumb down near the outer edge and a joystick appears there: push it to walk
// - drag anywhere else on your half to look around and aim
// - a big jump button and a big attack button in the corner, smaller buttons around them
const TOUCH_LOOK_SPEED = 0.006;
const STICK_RADIUS = 50;

function makeTouchHalf(index) {
  const c = CONTROLS[index];
  const outer = index === 0 ? "left" : "right";
  const half = document.createElement("div");
  half.className = "touchHalf p" + (index + 1);
  const base = document.createElement("div");
  base.className = "stickBase";
  const knob = document.createElement("div");
  knob.className = "stickKnob";
  base.append(knob);
  half.append(base);
  // Where the joystick rests when nobody is touching it (faded), like in Roblox
  const restBase = () => {
    base.classList.remove("active");
    base.style.left = (index === 0 ? 95 : half.clientWidth - 95) + "px";
    base.style.top = (half.clientHeight - 95) + "px";
    knob.style.transform = "";
  };

  // The buttons, placed in an arc. Positions are measured from the inner bottom corner of the half.
  const btns = document.createElement("div");
  btns.className = "btns";
  const inner = index === 0 ? "right" : "left";
  const place = (button, along, up, big) => {
    if (big) button.classList.add("big");
    button.style[inner] = along + "px";
    button.style.bottom = up + "px";
    btns.append(button);
  };
  place(holdKey("⤒", c.jump), 0, 0, true);
  place(holdKey(CASTLE ? "⚔" : "🎯", c.attack), 78, 22, true);
  place(holdKey(CASTLE ? "🔥" : "💣", c.fire), 10, 82);
  if (!CASTLE) {
    place(holdKey("🔭", c.aim), 66, 104);
    place(holdKey("⬇", c.crouch), 158, 0);
  }
  half.append(btns);

  let stickId = null, stickX = 0, stickY = 0;
  let lookId = null, lookX = 0, lookY = 0;
  half.addEventListener("pointerdown", e => {
    if (e.target.closest(".tb")) return;   // buttons handle their own touches
    e.preventDefault();
    const rect = half.getBoundingClientRect();
    const fromOuterEdge = outer === "left" ? e.clientX - rect.left : rect.right - e.clientX;
    if (stickId === null && fromOuterEdge < rect.width * 0.45 && e.clientY - rect.top > rect.height * 0.35) {
      stickId = e.pointerId;
      stickX = e.clientX;
      stickY = e.clientY;
      base.classList.add("active");
      base.style.left = (e.clientX - rect.left) + "px";
      base.style.top = (e.clientY - rect.top) + "px";
    } else if (lookId === null) {
      lookId = e.pointerId;
      lookX = e.clientX;
      lookY = e.clientY;
    } else {
      return;
    }
    try { half.setPointerCapture(e.pointerId); } catch (err) {}   // keep getting moves even if the finger leaves the half
  });
  half.addEventListener("pointermove", e => {
    const p = players[index];
    if (e.pointerId === stickId) {
      let dx = (e.clientX - stickX) / STICK_RADIUS, dy = (e.clientY - stickY) / STICK_RADIUS;
      const len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }
      knob.style.transform = "translate(" + dx * STICK_RADIUS + "px, " + dy * STICK_RADIUS + "px)";
      p.stick = { x: dx, y: dy };
    } else if (e.pointerId === lookId) {
      const speed = TOUCH_LOOK_SPEED * (1 - 0.6 * (p.aim || 0));   // slower while looking through the scope
      p.yaw -= (e.clientX - lookX) * speed;
      p.pitch = Math.max(-1.2, Math.min(1.2, p.pitch - (e.clientY - lookY) * speed));
      lookX = e.clientX;
      lookY = e.clientY;
    }
  });
  const release = e => {
    if (e.pointerId === stickId) { stickId = null; players[index].stick = null; restBase(); }
    if (e.pointerId === lookId) lookId = null;
  };
  half.addEventListener("pointerup", release);
  half.addEventListener("pointercancel", release);
  addEventListener("resize", restBase);
  requestAnimationFrame(restBase);
  return half;
}

function toggleFullscreen() {
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    const page = document.documentElement;
    Promise.resolve((page.requestFullscreen || page.webkitRequestFullscreen).call(page))
      .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape"))
      .catch(() => {});
  } catch (e) {}
}

const touchArea = document.getElementById("touch");
const topButtons = document.createElement("div");
topButtons.id = "topButtons";
const tapButton = (label, onTap) => { const b = touchButton(label, () => {}); b.addEventListener("click", onTap); return b; };
topButtons.append(tapButton("↻", () => restart()), tapButton("☰", () => { location.href = "index.html"; }));
if (document.fullscreenEnabled || document.webkitFullscreenEnabled) topButtons.append(tapButton("⛶", toggleFullscreen));
touchArea.append(makeTouchHalf(0), makeTouchHalf(1), topButtons);
document.addEventListener("gesturestart", e => e.preventDefault());   // no pinch zoom in Safari

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, isPhone ? 1.25 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();

// ---------- Sky and sunlight ----------
// A physically based sky: blue overhead, hazy near the horizon, with a real sun in it.
// The castle has a high midday sun. The modern city has a low golden sun with long shadows, late in the day.
const sunDirection = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(CASTLE ? 55 : 76),
                                                                THREE.MathUtils.degToRad(CASTLE ? 140 : 215));
const sky = new Sky();
const skyUniforms = sky.material.uniforms;
skyUniforms.turbidity.value = CASTLE ? 5 : 9;
skyUniforms.rayleigh.value = CASTLE ? 1.4 : 2.6;
skyUniforms.mieCoefficient.value = 0.004;
skyUniforms.mieDirectionalG.value = 0.85;
skyUniforms.sunPosition.value.copy(sunDirection);
// The sky is also used as the "environment": what shiny metal and water reflect
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
sky.scale.setScalar(50);
envScene.add(sky);
scene.environment = pmrem.fromScene(envScene).texture;
sky.scale.setScalar(900);
scene.add(sky);

const HAZE = new THREE.Color(CASTLE ? "#c9d9e6" : "#d8b892");
scene.fog = new THREE.Fog(HAZE, CASTLE ? 45 : 35, CASTLE ? 160 : 140);

const sun = new THREE.DirectionalLight(CASTLE ? "#fff1dc" : "#ffc98f", CASTLE ? 3.2 : 3.6);
sun.position.copy(sunDirection).multiplyScalar(45);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(isPhone ? 1024 : 4096);
if (!CASTLE) sun.position.copy(sunDirection).multiplyScalar(70);   // a low sun needs to be further away to light everything
const shadowSize = CASTLE ? 27 : 34;
Object.assign(sun.shadow.camera, { left: -shadowSize, right: shadowSize, top: shadowSize, bottom: -shadowSize, near: 1, far: CASTLE ? 110 : 160 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
sun.shadow.camera.layers.enableAll();   // the fighters live on their own layers, but should still cast shadows
scene.add(sun);
scene.add(CASTLE ? new THREE.HemisphereLight("#cfe3ff", "#4d5b33", 0.45) : new THREE.HemisphereLight("#ffdcb5", "#4a4038", 0.55));

// ---------- Textures painted in code ----------
// Each surface gets a color picture and a "normal map": a picture that tells the light where the surface
// has bumps and grooves, so flat walls look like real stone blocks.
function makeCanvas(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  return [c, c.getContext("2d")];
}

// Same random numbers every time, so the textures look the same on every computer
function seeded(seed) {
  return () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
}

// Turn a black-and-white "height" picture into a normal map (the slope at each pixel)
function normalFromHeight(heightCanvas, strength) {
  const s = heightCanvas.width;
  const src = heightCanvas.getContext("2d").getImageData(0, 0, s, s).data;
  const [c, g] = makeCanvas(s);
  const out = g.createImageData(s, s);
  const h = (x, y) => src[(((y + s) % s) * s + ((x + s) % s)) * 4] / 255;
  for (let y = 0; y < s; y++) {
    for (let x = 0; x < s; x++) {
      const dx = (h(x + 1, y) - h(x - 1, y)) * strength;
      const dy = (h(x, y + 1) - h(x, y - 1)) * strength;
      const len = Math.hypot(dx, dy, 1);
      const i = (y * s + x) * 4;
      out.data[i] = (-dx / len * 0.5 + 0.5) * 255;
      out.data[i + 1] = (dy / len * 0.5 + 0.5) * 255;
      out.data[i + 2] = (1 / len * 0.5 + 0.5) * 255;
      out.data[i + 3] = 255;
    }
  }
  g.putImageData(out, 0, 0);
  return c;
}

function toTexture(canvas, isColor) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = isColor ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = 8;
  return t;
}

// Lots of soft random dots: used for dirt, moss and speckles
function speckle(g, size, rand, count, colors, minR, maxR, alpha) {
  for (let i = 0; i < count; i++) {
    g.globalAlpha = alpha * (0.3 + rand() * 0.7);
    g.fillStyle = colors[Math.floor(rand() * colors.length)];
    g.beginPath();
    g.arc(rand() * size, rand() * size, minR + rand() * (maxR - minR), 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;
}

function stoneTextures() {
  const s = TEXTURE_SIZE, rand = seeded(42);
  const [color, cg] = makeCanvas(s);
  const [height, hg] = makeCanvas(s);
  cg.fillStyle = "#5a554e";   // mortar between the blocks
  cg.fillRect(0, 0, s, s);
  hg.fillStyle = "#000";
  hg.fillRect(0, 0, s, s);
  const rows = 8, bw = s / 4, bh = s / rows;
  for (let row = 0; row < rows; row++) {
    for (let col = -1; col < 5; col++) {
      const x = col * bw + (row % 2) * bw / 2, y = row * bh;
      const tone = 112 + rand() * 50;
      cg.fillStyle = "rgb(" + tone + "," + (tone - 6) + "," + (tone - 16) + ")";
      cg.fillRect(x + 3, y + 3, bw - 6, bh - 6);
      // Each block is raised, with rounded edges
      hg.fillStyle = "#777";
      hg.fillRect(x + 3, y + 3, bw - 6, bh - 6);
      hg.fillStyle = "#bbb";
      hg.fillRect(x + 6, y + 6, bw - 12, bh - 12);
      hg.fillStyle = "#ddd";
      hg.fillRect(x + 10, y + 9, bw - 20, bh - 18);
    }
  }
  speckle(cg, s, rand, 2500, ["#3e3a35", "#8a847a", "#a39d92"], 0.5, 2, 0.5);   // grit
  speckle(cg, s, rand, 160, ["#4d6b34", "#5e7d3c"], 2, 7, 0.35);                // moss
  speckle(hg, s, rand, 3000, ["#000", "#fff"], 0.5, 2.5, 0.25);                  // chips and pits
  return { map: toTexture(color, true), normalMap: toTexture(normalFromHeight(height, 5), false) };
}

function grassTextures() {
  const s = TEXTURE_SIZE, rand = seeded(7);
  const [color, cg] = makeCanvas(s);
  const [height, hg] = makeCanvas(s);
  cg.fillStyle = "#4b7a2c";
  cg.fillRect(0, 0, s, s);
  hg.fillStyle = "#808080";
  hg.fillRect(0, 0, s, s);
  speckle(cg, s, rand, 60, ["#5a8a35", "#416b27", "#62903a"], 20, 50, 0.35);   // patches
  speckle(cg, s, rand, 30, ["#6b5a3a"], 6, 14, 0.25);                            // bits of soil
  // Thousands of little blades of grass
  for (let i = 0; i < s * 14; i++) {
    const x = rand() * s, y = rand() * s, len = 3 + rand() * 7;
    const shade = rand();
    cg.strokeStyle = shade < 0.33 ? "#6aa340" : shade < 0.66 ? "#3f6f22" : "#7fb84f";
    hg.strokeStyle = shade < 0.5 ? "#fff" : "#bbb";
    cg.lineWidth = hg.lineWidth = 1;
    const bend = (rand() - 0.5) * 3;
    for (const g of [cg, hg]) {
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + bend, y - len);
      g.stroke();
    }
  }
  return { map: toTexture(color, true), normalMap: toTexture(normalFromHeight(height, 2), false) };
}

function roofTextures() {
  const s = TEXTURE_SIZE / 2, rand = seeded(3);
  const [color, cg] = makeCanvas(s);
  const [height, hg] = makeCanvas(s);
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 9; col++) {
      const x = col * s / 8 + (row % 2) * s / 16, y = row * s / 8;
      const tone = 120 + rand() * 50;
      const tile = cg.createLinearGradient(0, y, 0, y + s / 8);
      tile.addColorStop(0, "rgb(" + tone + ",48,36)");
      tile.addColorStop(1, "rgb(" + (tone - 50) + ",28,20)");
      cg.fillStyle = tile;
      cg.beginPath();
      cg.ellipse(x, y + s / 16, s / 17, s / 14, 0, 0, Math.PI * 2);
      cg.fill();
      const bump = hg.createLinearGradient(0, y, 0, y + s / 8);
      bump.addColorStop(0, "#fff");
      bump.addColorStop(1, "#222");
      hg.fillStyle = bump;
      hg.beginPath();
      hg.ellipse(x, y + s / 16, s / 17, s / 14, 0, 0, Math.PI * 2);
      hg.fill();
    }
  }
  return { map: toTexture(color, true), normalMap: toTexture(normalFromHeight(height, 3), false) };
}

function chainmailTextures() {
  const s = 128;
  const [color, cg] = makeCanvas(s);
  const [height, hg] = makeCanvas(s);
  cg.fillStyle = "#3a3d42";
  cg.fillRect(0, 0, s, s);
  hg.fillStyle = "#000";
  hg.fillRect(0, 0, s, s);
  cg.lineWidth = hg.lineWidth = 2;
  cg.strokeStyle = "#9aa1aa";
  hg.strokeStyle = "#fff";
  for (let y = 0; y < s + 8; y += 8) {
    for (let x = 0; x < s + 8; x += 8) {
      for (const g of [cg, hg]) {
        g.beginPath();
        g.arc(x + (y % 16 ? 4 : 0), y, 3.5, 0, Math.PI * 2);
        g.stroke();
      }
    }
  }
  return { map: toTexture(color, true), normalMap: toTexture(normalFromHeight(height, 3), false) };
}

function lavaTextureMaker() {
  const s = 256, rand = seeded(9);
  const [c, g] = makeCanvas(s);
  g.fillStyle = "#3a0b02";   // dark cooled crust
  g.fillRect(0, 0, s, s);
  for (let i = 0; i < 90; i++) {
    const x = rand() * s, y = rand() * s, r = 8 + rand() * 30;
    const blob = g.createRadialGradient(x, y, 0, x, y, r);
    blob.addColorStop(0, "rgba(255, 240, 120, 1)");
    blob.addColorStop(0.35, "rgba(255, 140, 0, 0.9)");
    blob.addColorStop(1, "rgba(200, 40, 0, 0)");
    g.fillStyle = blob;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  return toTexture(c, true);
}

function waterTextureMaker() {
  const s = 128, rand = seeded(5);
  const [c, g] = makeCanvas(s);
  const water = g.createLinearGradient(0, 0, s, 0);
  water.addColorStop(0, "#2f78c4");
  water.addColorStop(0.5, "#5aa6e8");
  water.addColorStop(1, "#2f78c4");
  g.fillStyle = water;
  g.fillRect(0, 0, s, s);
  for (let i = 0; i < 70; i++) {
    g.fillStyle = "rgba(255, 255, 255, " + (0.15 + rand() * 0.5) + ")";
    g.fillRect(rand() * s, rand() * s, 1 + rand() * 3, 15 + rand() * 30);
  }
  return toTexture(c, true);
}

// Only paint the textures the chosen mode needs (painting them takes a moment)
const STONE = CASTLE ? stoneTextures() : null;
const GRASS = CASTLE ? grassTextures() : null;
const ROOF = CASTLE ? roofTextures() : null;
const MAIL = CASTLE ? chainmailTextures() : null;
const lavaTexture = CASTLE ? lavaTextureMaker() : null;
const waterTexture = CASTLE ? waterTextureMaker() : null;

// A material that uses a texture set, repeated a number of times across the surface.
// Materials are remembered and reused, so a hundred buildings don't each get their own copy of the pictures.
const materialCache = new Map();
let textureSetNumber = 0;
function textured(set, repeatX, repeatY, extra = {}) {
  if (!set.id) set.id = ++textureSetNumber;
  repeatX = Math.round(repeatX * 4) / 4;
  repeatY = Math.round(repeatY * 4) / 4;
  const key = set.id + "|" + repeatX + "|" + repeatY + "|" + JSON.stringify(extra);
  if (materialCache.has(key)) return materialCache.get(key);
  const map = set.map.clone();
  const normalMap = set.normalMap.clone();
  for (const t of [map, normalMap]) { t.needsUpdate = true; t.repeat.set(repeatX, repeatY); }
  const material = new THREE.MeshStandardMaterial({ map, normalMap, roughness: 0.9, ...extra });
  materialCache.set(key, material);
  return material;
}

// ---------- The arena ----------
function addBox(x, y, z, w, h, d, material, parent = scene) {
  const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  box.position.set(x, y, z);
  box.castShadow = true;
  box.receiveShadow = true;
  parent.add(box);
  return box;
}

// What both arenas fill in: things to stand on, and (only in the castle) lava, waterfalls and pools.
// Platforms are { x, z, w, d, h } where h is how high the top is; "bottom" is for things that float.
const platforms = [];
const lavaPools = [];
const waterfalls = [];
const waterPools = [];
const lavaLights = [];
const flames = [];
const clouds = [];
let lavaMaterial = null;
const wind = { value: 0 };   // time, for grass blowing in the wind

// ---------- The medieval arena: a castle courtyard ----------
function buildCastle() {
const ground = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 2, ARENA * 2), textured(GRASS, 10, 10, { roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
// Meadow outside the walls, so the trees don't stand in the void
const meadow = new THREE.Mesh(new THREE.CircleGeometry(400, 48), textured(GRASS, 80, 80, { roughness: 1 }));
meadow.rotation.x = -Math.PI / 2;
meadow.position.y = -0.03;
meadow.receiveShadow = true;
scene.add(meadow);

// Castle walls around the arena, with battlements on top
for (const side of [-1, 1]) {
  addBox(0, 2.5, side * (ARENA + 0.5), ARENA * 2 + 2, 5, 1, textured(STONE, 10, 1.25));
  addBox(side * (ARENA + 0.5), 2.5, 0, 1, 5, ARENA * 2 + 2, textured(STONE, 10, 1.25));
  for (let i = -ARENA; i <= ARENA; i += 2) {
    addBox(i, 5.4, side * (ARENA + 0.5), 1, 0.8, 1.1, textured(STONE, 0.25, 0.2));
    addBox(side * (ARENA + 0.5), 5.4, i, 1.1, 0.8, 1, textured(STONE, 0.25, 0.2));
  }
}
// Round towers with tiled roofs and a flag in the corners
const roofMaterial = textured(ROOF, 4, 2, { roughness: 0.7 });
for (const x of [-1, 1]) for (const z of [-1, 1]) {
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.4, 10, 24), textured(STONE, 3.5, 2.5));
  tower.position.set(x * (ARENA + 0.5), 5, z * (ARENA + 0.5));
  tower.castShadow = tower.receiveShadow = true;
  scene.add(tower);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.9, 4, 24), roofMaterial);
  roof.position.set(x * (ARENA + 0.5), 12, z * (ARENA + 0.5));
  roof.castShadow = true;
  scene.add(roof);
  const pole = addBox(x * (ARENA + 0.5), 15, z * (ARENA + 0.5), 0.08, 2.4, 0.08, new THREE.MeshStandardMaterial({ color: "#555" }));
  pole.castShadow = false;
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.7),
    new THREE.MeshStandardMaterial({ color: x * z > 0 ? "#c0392b" : "#2c5aa0", side: THREE.DoubleSide }));
  flag.position.set(x * (ARENA + 0.5) + 0.6, 15.8, z * (ARENA + 0.5));
  scene.add(flag);
}

// Platforms you can jump up on
platforms.push(
  // Big blocks in the corners, each with a higher block on top
  { x: -10, z: -10, w: 5, d: 5, h: 1.2 }, { x: 10, z: 10, w: 5, d: 5, h: 1.2 },
  { x: 10, z: -10, w: 5, d: 5, h: 1.2 }, { x: -10, z: 10, w: 5, d: 5, h: 1.2 },
  { x: -11, z: -11, w: 2.5, d: 2.5, h: 2.4 }, { x: 11, z: 11, w: 2.5, d: 2.5, h: 2.4 },
  { x: 11, z: -11, w: 2.5, d: 2.5, h: 2.4 }, { x: -11, z: 11, w: 2.5, d: 2.5, h: 2.4 },
  // The tower in the middle, with steps on all four sides and a lookout on top
  { x: 0, z: 0, w: 6, d: 6, h: 2.4 }, { x: 0, z: 0, w: 2.4, d: 2.4, h: 3.6 },
  { x: 0, z: 4.5, w: 3, d: 3, h: 1.2 }, { x: 0, z: -4.5, w: 3, d: 3, h: 1.2 },
  { x: 4.5, z: 0, w: 3, d: 3, h: 1.2 }, { x: -4.5, z: 0, w: 3, d: 3, h: 1.2 },
  // Floating stepping stones over the lava
  { x: -12, z: -2, w: 2, d: 2, h: 1.5, bottom: 1.1 }, { x: -12, z: 2.2, w: 2, d: 2, h: 1.5, bottom: 1.1 },
  { x: 12, z: -2.2, w: 2, d: 2, h: 1.5, bottom: 1.1 }, { x: 12, z: 2, w: 2, d: 2, h: 1.5, bottom: 1.1 },
  // Low walls to hide behind and jump over
  { x: -6, z: -15, w: 3, d: 1.2, h: 1.0 }, { x: 6, z: 15, w: 3, d: 1.2, h: 1.0 },
  { x: -15, z: 6, w: 1.2, d: 4, h: 1.4 }, { x: 15, z: -6, w: 1.2, d: 4, h: 1.4 }
);

// Waterfalls in the middle of every wall. Stand in one and hold jump to swim up,
// then step sideways onto one of the high ledges next to it. "along" says which way the wall runs.
waterfalls.push(
  { x: 0, z: -ARENA + 0.6, along: "x", width: 3 },
  { x: 0, z: ARENA - 0.6, along: "x", width: 3 },
  { x: -ARENA + 0.6, z: 0, along: "z", width: 3 },
  { x: ARENA - 0.6, z: 0, along: "z", width: 3 }
);
for (const w of waterfalls) {
  for (const side of [-1, 1]) {
    const reach = w.width / 2 + 2;
    if (w.along === "x") platforms.push({ x: w.x + side * reach, z: w.z - Math.sign(w.z) * 0.9, w: 4, d: 3, h: LEDGE_HEIGHT });
    else platforms.push({ x: w.x - Math.sign(w.x) * 0.9, z: w.z + side * reach, w: 3, d: 4, h: LEDGE_HEIGHT });
  }
}

const grassTopMaterial = textured(GRASS, 1, 1, { roughness: 1 });
for (const p of platforms) {
  const bottom = p.bottom || 0;
  const height = p.h - bottom;
  addBox(p.x, bottom + height / 2, p.z, p.w, height, p.d, textured(STONE, p.w / 4, height / 2.5));
  const top = addBox(p.x, p.h + 0.03, p.z, p.w + 0.06, 0.06, p.d + 0.06, grassTopMaterial);
  top.castShadow = false;
}

// Lava pools: glowing, slowly flowing, and they bounce you up and hurt
lavaPools.push(
  { x: -12, z: 0, w: 5, d: 7 },
  { x: 12, z: 0, w: 5, d: 7 }
);
lavaMaterial = new THREE.MeshStandardMaterial({ map: lavaTexture, emissive: "#ffffff", emissiveMap: lavaTexture,
                                                emissiveIntensity: 3, roughness: 0.6 });
for (const pool of lavaPools) {
  const lava = new THREE.Mesh(new THREE.PlaneGeometry(pool.w, pool.d), lavaMaterial);
  lava.rotation.x = -Math.PI / 2;
  lava.position.set(pool.x, 0.02, pool.z);
  scene.add(lava);
  // A dark stone rim around the lava
  const rim = textured(STONE, 1.5, 0.15, { color: "#8a8076" });
  addBox(pool.x, 0.12, pool.z - pool.d / 2 - 0.2, pool.w + 0.8, 0.24, 0.4, rim);
  addBox(pool.x, 0.12, pool.z + pool.d / 2 + 0.2, pool.w + 0.8, 0.24, 0.4, rim);
  addBox(pool.x - pool.w / 2 - 0.2, 0.12, pool.z, 0.4, 0.24, pool.d, rim);
  addBox(pool.x + pool.w / 2 + 0.2, 0.12, pool.z, 0.4, 0.24, pool.d, rim);
  const light = new THREE.PointLight("#ff6a00", 40, 14, 1.6);
  light.position.set(pool.x, 1.3, pool.z);
  scene.add(light);
  lavaLights.push(light);
}

// Water: curtains pouring down the walls into shiny pools
const waterMaterial = new THREE.MeshStandardMaterial({ map: waterTexture, transparent: true, opacity: 0.88, roughness: 0.1,
                                                       metalness: 0.1, side: THREE.DoubleSide, depthWrite: false });
const poolMaterial = new THREE.MeshStandardMaterial({ color: "#1d5a8f", roughness: 0.04, metalness: 0.3, transparent: true, opacity: 0.92 });
for (const w of waterfalls) {
  const inward = w.along === "x" ? new THREE.Vector3(0, 0, -Math.sign(w.z)) : new THREE.Vector3(-Math.sign(w.x), 0, 0);
  for (const offset of [-0.55, 0]) {   // a curtain against the wall and one in front, so it looks thick
    const water = new THREE.Mesh(new THREE.PlaneGeometry(w.width, WATERFALL_TOP), waterMaterial);
    water.position.set(w.x, WATERFALL_TOP / 2, w.z).addScaledVector(inward, offset);
    if (w.along === "z") water.rotation.y = Math.PI / 2;
    scene.add(water);
  }
  const pool = new THREE.Mesh(new THREE.CircleGeometry(2.4, 40), poolMaterial);
  pool.rotation.x = -Math.PI / 2;
  pool.position.set(w.x + inward.x * 0.9, 0.03, w.z + inward.z * 0.9);
  pool.receiveShadow = true;
  scene.add(pool);
  waterPools.push({ x: pool.position.x, z: pool.position.z, r: 2.4 });
}
}   // end of buildCastle

// ---------- The modern arena: a fort in a ruined city at sunset ----------
// Textures for the city, painted in code like the castle ones
function asphaltTextures() {
  const s = TEXTURE_SIZE, rand = seeded(13);
  const [color, cg] = makeCanvas(s);
  const [height, hg] = makeCanvas(s);
  cg.fillStyle = "#3b3b3d";
  cg.fillRect(0, 0, s, s);
  hg.fillStyle = "#808080";
  hg.fillRect(0, 0, s, s);
  speckle(cg, s, rand, s * 18, ["#2a2a2c", "#4d4d50", "#58585b", "#333"], 0.5, 1.6, 0.8);   // gravel
  speckle(hg, s, rand, s * 18, ["#000", "#fff"], 0.5, 1.4, 0.5);
  speckle(cg, s, rand, 30, ["#2b2b2d", "#454547"], 20, 60, 0.25);                               // patches
  // Cracks
  cg.strokeStyle = "#1c1c1d";
  hg.strokeStyle = "#000";
  for (let i = 0; i < 10; i++) {
    let x = rand() * s, y = rand() * s;
    for (const g of [cg, hg]) { g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y); }
    for (let j = 0; j < 8; j++) {
      x += (rand() - 0.5) * 40;
      y += (rand() - 0.5) * 40;
      cg.lineTo(x, y);
      hg.lineTo(x, y);
    }
    cg.stroke();
    hg.stroke();
  }
  return { map: toTexture(color, true), normalMap: toTexture(normalFromHeight(height, 3), false) };
}

function concreteTextures(base) {
  const s = TEXTURE_SIZE, rand = seeded(31);
  const [color, cg] = makeCanvas(s);
  const [height, hg] = makeCanvas(s);
  cg.fillStyle = base;
  cg.fillRect(0, 0, s, s);
  hg.fillStyle = "#808080";
  hg.fillRect(0, 0, s, s);
  speckle(cg, s, rand, s * 6, ["#000", "#fff"], 0.5, 1.5, 0.12);
  speckle(cg, s, rand, 40, ["#3d3a35", "#5a5246"], 15, 60, 0.12);   // dirt and water stains
  speckle(hg, s, rand, s * 8, ["#000", "#fff"], 0.5, 2, 0.35);
  // Joints between the concrete slabs
  cg.fillStyle = "rgba(0, 0, 0, 0.35)";
  hg.fillStyle = "#000";
  for (const g of [cg, hg]) { g.fillRect(0, 0, s, 3); g.fillRect(0, 0, 3, s); }
  return { map: toTexture(color, true), normalMap: toTexture(normalFromHeight(height, 2.5), false) };
}

// A wall of a building: plaster or brick with rows of windows (one window per texture)
function facadeTextures(wallColor) {
  const s = TEXTURE_SIZE / 2, rand = seeded(19);
  const [color, cg] = makeCanvas(s);
  const [height, hg] = makeCanvas(s);
  cg.fillStyle = wallColor;
  cg.fillRect(0, 0, s, s);
  hg.fillStyle = "#909090";
  hg.fillRect(0, 0, s, s);
  speckle(cg, s, rand, s * 5, ["#000", "#fff"], 0.5, 1.4, 0.12);
  speckle(cg, s, rand, 12, ["#2b2620"], 10, 40, 0.15);
  // Window: frame, dark glass with a sky reflection, a sill below
  const wx = s * 0.25, wy = s * 0.2, ww = s * 0.5, wh = s * 0.55;
  cg.fillStyle = "#d9d4cb";
  cg.fillRect(wx - 5, wy - 5, ww + 10, wh + 10);
  const glass = cg.createLinearGradient(wx, wy, wx + ww, wy + wh);
  glass.addColorStop(0, "#5d7891");
  glass.addColorStop(0.5, "#1f2a35");
  glass.addColorStop(1, "#33424f");
  cg.fillStyle = glass;
  cg.fillRect(wx, wy, ww, wh);
  if (wallColor === "#8f6f5a" || wallColor === "#7d6a58") {   // these buildings have broken windows
    cg.fillStyle = "#0b0d10";
    cg.beginPath();
    cg.moveTo(wx + ww * 0.6, wy);
    cg.lineTo(wx + ww, wy);
    cg.lineTo(wx + ww, wy + wh * 0.5);
    cg.lineTo(wx + ww * 0.75, wy + wh * 0.3);
    cg.fill();
  }
  cg.fillStyle = "#d9d4cb";
  cg.fillRect(wx + ww / 2 - 2, wy, 4, wh);
  cg.fillRect(wx, wy + wh / 2 - 2, ww, 4);
  cg.fillStyle = "#bfb9ae";
  cg.fillRect(wx - 10, wy + wh + 5, ww + 20, 8);
  // Height: the window is set back into the wall, the sill sticks out
  hg.fillStyle = "#fff";
  hg.fillRect(wx - 5, wy - 5, ww + 10, wh + 10);
  hg.fillStyle = "#000";
  hg.fillRect(wx, wy, ww, wh);
  hg.fillStyle = "#fff";
  hg.fillRect(wx - 10, wy + wh + 5, ww + 20, 8);
  return { map: toTexture(color, true), normalMap: toTexture(normalFromHeight(height, 4), false) };
}

// Shipping container sides: deep ridges (the color comes from the material)
function corrugatedTextures() {
  const s = 256, rand = seeded(23);
  const [color, cg] = makeCanvas(s);
  const [height, hg] = makeCanvas(s);
  cg.fillStyle = "#c8c8c8";
  cg.fillRect(0, 0, s, s);
  for (let x = 0; x < s; x++) {
    const v = Math.round(128 + Math.sin(x / s * Math.PI * 2 * 12) * 120);
    hg.fillStyle = "rgb(" + v + "," + v + "," + v + ")";
    hg.fillRect(x, 0, 1, s);
    const shadeValue = Math.round(185 + Math.sin(x / s * Math.PI * 2 * 12) * 30);
    cg.fillStyle = "rgb(" + shadeValue + "," + shadeValue + "," + shadeValue + ")";
    cg.fillRect(x, 0, 1, s);
  }
  speckle(cg, s, rand, 120, ["#6b3a1f", "#8a4b25", "#3a2a1f"], 2, 10, 0.45);   // rust
  return { map: toTexture(color, true), normalMap: toTexture(normalFromHeight(height, 6), false) };
}

function crateTextures() {
  const s = 256, rand = seeded(29);
  const [color, cg] = makeCanvas(s);
  const [height, hg] = makeCanvas(s);
  // Planks
  for (let i = 0; i < 6; i++) {
    const tone = 120 + rand() * 30;
    cg.fillStyle = "rgb(" + tone + "," + (tone * 0.78) + "," + (tone * 0.5) + ")";
    cg.fillRect(0, i * s / 6, s, s / 6);
    cg.fillStyle = "rgba(60, 35, 15, 0.6)";
    cg.fillRect(0, i * s / 6, s, 2);
    hg.fillStyle = "#aaa";
    hg.fillRect(0, i * s / 6 + 2, s, s / 6 - 2);
  }
  for (let i = 0; i < 200; i++) {   // wood grain
    cg.strokeStyle = "rgba(70, 45, 20, 0.25)";
    cg.beginPath();
    const y = rand() * s;
    cg.moveTo(0, y);
    cg.bezierCurveTo(s / 3, y + (rand() - 0.5) * 6, s * 2 / 3, y + (rand() - 0.5) * 6, s, y);
    cg.stroke();
  }
  // Frame and a diagonal brace
  cg.strokeStyle = "#5b3d1f";
  hg.strokeStyle = "#fff";
  cg.lineWidth = hg.lineWidth = 22;
  for (const g of [cg, hg]) {
    g.strokeRect(11, 11, s - 22, s - 22);
    g.beginPath();
    g.moveTo(20, s - 20);
    g.lineTo(s - 20, 20);
    g.stroke();
  }
  return { map: toTexture(color, true), normalMap: toTexture(normalFromHeight(height, 3), false) };
}

const smokeSources = [];

// ---------- Collision helpers ----------
function onLava(x, z) {
  return lavaPools.some(p => Math.abs(x - p.x) < p.w / 2 && Math.abs(z - p.z) < p.d / 2);
}

function inWaterfall(p) {
  return waterfalls.some(w => {
    const along = w.along === "x" ? p.x - w.x : p.z - w.z;
    const across = w.along === "x" ? p.z - w.z : p.x - w.x;
    return Math.abs(along) < w.width / 2 && Math.abs(across) < 1.2 && p.y < WATERFALL_TOP;
  });
}

function inPool(x, z) {
  return waterPools.some(p => Math.hypot(x - p.x, z - p.z) < p.r);
}

function insidePlatform(p, x, z, extra) {
  return Math.abs(x - p.x) < p.w / 2 + extra && Math.abs(z - p.z) < p.d / 2 + extra;
}

// The highest thing you can stand on at (x, z) if you are coming down from height fromY
function floorAt(x, z, fromY) {
  let floor = 0;
  for (const p of platforms) {
    if (insidePlatform(p, x, z, 0.3) && p.h <= fromY + 0.05 && p.h > floor) floor = p.h;
  }
  return floor;
}

// Is there a block in the way at (x, z) for someone standing at height y?
function blockedAt(x, z, y) {
  return platforms.some(p => insidePlatform(p, x, z, 0.4) && y < p.h - 0.05 && y + 1.8 > (p.bottom || 0));
}

function freeSpot(x, z, margin) {
  return !onLava(x, z) && !inPool(x, z) && !platforms.some(p => insidePlatform(p, x, z, margin));
}

// ---------- Castle decorations ----------
function decorateCastle() {
// Grass blades: three thin leaves per clump, dark at the root and light at the tip.
// One InstancedMesh draws thousands of clumps at once, which is fast.
function grassClumpGeometry() {
  const positions = [], colors = [];
  const dark = new THREE.Color("#2f5a1b"), light = new THREE.Color("#8cc45a");
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI, lean = 0.06;
    const cx = Math.cos(a) * 0.05, cz = Math.sin(a) * 0.05;
    positions.push(-cx, 0, -cz, cx, 0, cz, lean * Math.cos(a + 1), 0.4, lean * Math.sin(a + 1));
    colors.push(dark.r, dark.g, dark.b, dark.r, dark.g, dark.b, light.r, light.g, light.b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  g.computeVertexNormals();
  return g;
}
const clumpCount = isPhone ? 1500 : 6000;
const grassMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 1 });
// Wind: bend the tip of every blade a little, in waves that roll across the courtyard
grassMaterial.onBeforeCompile = shader => {
  shader.uniforms.windTime = wind;
  shader.vertexShader = "uniform float windTime;\n" + shader.vertexShader.replace("#include <begin_vertex>", `
    #include <begin_vertex>
    float sway = sin(windTime * 1.8 + instanceMatrix[3].x * 0.35 + instanceMatrix[3].z * 0.25) * 0.09 * (position.y / 0.4);
    transformed.x += sway;
    transformed.z += sway * 0.6;`);
};
const grass = new THREE.InstancedMesh(grassClumpGeometry(), grassMaterial, clumpCount);
const place = new THREE.Object3D();
const tint = new THREE.Color();
const grassRand = seeded(21);
for (let i = 0; i < clumpCount; i++) {
  let x, z;
  do {
    x = (grassRand() * 2 - 1) * (ARENA - 0.3);
    z = (grassRand() * 2 - 1) * (ARENA - 0.3);
  } while (!freeSpot(x, z, 0.1));
  place.position.set(x, 0, z);
  place.rotation.set(0, grassRand() * Math.PI, 0);
  place.scale.setScalar(0.6 + grassRand() * 0.9);
  place.updateMatrix();
  grass.setMatrixAt(i, place.matrix);
  grass.setColorAt(i, tint.setHSL(0.22 + grassRand() * 0.06, 0.5, 0.45 + grassRand() * 0.25));
}
grass.receiveShadow = true;
scene.add(grass);

// Little flowers in the grass
const flowerCount = isPhone ? 120 : 400;
const flowers = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.05, 0),
  new THREE.MeshStandardMaterial({ roughness: 0.6 }), flowerCount);
const flowerColors = ["#ffe14d", "#ffffff", "#e75480", "#8a6bd8"].map(c => new THREE.Color(c));
for (let i = 0; i < flowerCount; i++) {
  let x, z;
  do {
    x = (grassRand() * 2 - 1) * (ARENA - 0.5);
    z = (grassRand() * 2 - 1) * (ARENA - 0.5);
  } while (!freeSpot(x, z, 0.2));
  place.position.set(x, 0.22 + grassRand() * 0.1, z);
  place.rotation.set(0, 0, 0);
  place.scale.setScalar(1);
  place.updateMatrix();
  flowers.setMatrixAt(i, place.matrix);
  flowers.setColorAt(i, flowerColors[Math.floor(grassRand() * flowerColors.length)]);
}
scene.add(flowers);

const pineMaterials = ["#24502a", "#2e6233", "#1f4a2a"].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, flatShading: true }));

const treeRand = seeded(77);
const treeCount = isPhone ? 30 : 70;
for (let i = 0; i < treeCount; i++) {
  const angle = (i / treeCount) * Math.PI * 2 + treeRand() * 0.1;
  const dist = ARENA + 6 + treeRand() * 30;
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 3, 7), barkMaterial);
  trunk.position.y = 1.5;
  trunk.castShadow = true;

      cone.position.y = 3 + j * 1.5;
      cone.rotation.y = treeRand() * Math.PI;
      cone.castShadow = true;
      tree.add(cone);
    }
  } else {
    const mat = leafMaterials[i % 3];
    for (let j = 0; j < 5; j++) {
      const puff = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4 + treeRand() * 0.8, 1), mat);
      puff.position.set((treeRand() - 0.5) * 2.2, 4 + treeRand() * 1.8, (treeRand() - 0.5) * 2.2);

      tree.add(puff);

// ---------- Knights ----------
// Each knight is built from many small shapes: plate armor over chain mail, a tabard in the team color,
// a great helm with a plume, a cape, a sword and a kite shield. It faces -Z (the way the camera looks).
function latheOf(points, segments = 24) {
  return new THREE.LatheGeometry(points.map(([r, y]) => new THREE.Vector2(r, y)), segments);
}

function swordGeometry() {
  // A blade that narrows to a point, with a slightly raised middle (bevel)
  const shape = new THREE.Shape();
  shape.moveTo(-0.035, 0);
  shape.lineTo(-0.03, 0.85);
  shape.lineTo(0, 0.97);
  shape.lineTo(0.03, 0.85);
  shape.lineTo(0.035, 0);
  shape.lineTo(-0.035, 0);
  const g = new THREE.ExtrudeGeometry(shape, { depth: 0.006, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.012, bevelSegments: 2 });
  g.translate(0, 0, -0.003);
  return g;
}

function makeSword(steel, gold, leather) {
  // Built pointing up along +Y, with the grip at the origin
  const sword = new THREE.Group();
  const blade = new THREE.Mesh(swordGeometry(), steel);
  blade.position.y = 0.08;
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.035, 0.05), gold);
  guard.position.y = 0.07;
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.025, 0.18, 8), leather);
  grip.position.y = -0.03;
  const pommel = new THREE.Mesh(new THREE.SphereGeometry(0.04, 10, 8), gold);
  pommel.position.y = -0.13;
  sword.add(blade, guard, grip, pommel);
  sword.traverse(o => { o.castShadow = true; });
  return sword;
}

function kiteShieldGeometry(scale) {
  const s = new THREE.Shape();
  s.moveTo(0, -0.5 * scale);
  s.quadraticCurveTo(0.36 * scale, -0.15 * scale, 0.3 * scale, 0.3 * scale);
  s.quadraticCurveTo(0, 0.42 * scale, -0.3 * scale, 0.3 * scale);
  s.quadraticCurveTo(-0.36 * scale, -0.15 * scale, 0, -0.5 * scale);
  return new THREE.ExtrudeGeometry(s, { depth: 0.03, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.02, bevelSegments: 2 });
}

function makeKnight(color) {
  const knight = new THREE.Group();
  knight.rotation.order = "YXZ";   // turn first, then fall over (when dying) around your own sideways axis
  const team = new THREE.MeshStandardMaterial({ color, roughness: 0.85, side: THREE.DoubleSide });
  const steel = new THREE.MeshStandardMaterial({ color: "#bfc5cd", roughness: 0.3, metalness: 1 });
  const worn = new THREE.MeshStandardMaterial({ color: "#8f969f", roughness: 0.45, metalness: 1 });
  const mail = new THREE.MeshStandardMaterial({ map: MAIL.map, normalMap: MAIL.normalMap, roughness: 0.45, metalness: 0.8 });
  mail.map.repeat.set(4, 4);
  mail.normalMap.repeat.set(4, 4);
  const leather = new THREE.MeshStandardMaterial({ color: "#3d2616", roughness: 0.8 });
  const gold = new THREE.MeshStandardMaterial({ color: "#e3b341", roughness: 0.25, metalness: 1 });
  const black = new THREE.MeshStandardMaterial({ color: "#050505", roughness: 1 });
  const add = (geometry, material, x, y, z, parent = knight) => {
    const m = new THREE.Mesh(geometry, material);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  };

  // Legs: chain mail thighs, steel knee caps, greaves and pointed steel shoes. The knee bends when walking.
  const makeLeg = x => {
    const hip = new THREE.Group();
    hip.position.set(x, 0.93, 0);
    knight.add(hip);
    add(new THREE.CylinderGeometry(0.1, 0.085, 0.45, 12), mail, 0, -0.22, 0, hip);
    const knee = new THREE.Group();
    knee.position.y = -0.45;
    hip.add(knee);
    add(new THREE.SphereGeometry(0.085, 12, 10), steel, 0, 0, -0.03, knee);
    add(latheOf([[0.07, -0.42], [0.085, -0.3], [0.09, -0.12], [0.08, 0]], 14), steel, 0, 0, 0, knee);
    const shoe = add(new THREE.BoxGeometry(0.13, 0.08, 0.27), worn, 0, -0.44, -0.05, knee);
    shoe.scale.set(1, 1, 1);
    return { hip, knee };
  };
  const legL = makeLeg(-0.13);
  const legR = makeLeg(0.13);

  // Body: chain mail, a steel breastplate (flattened front to back), and a tabard in the team color
  const torso = new THREE.Group();
  knight.add(torso);
  add(new THREE.CylinderGeometry(0.29, 0.27, 0.62, 18), mail, 0, 1.2, 0, torso);
  const plate = add(latheOf([[0.27, 0], [0.3, 0.12], [0.32, 0.3], [0.315, 0.45], [0.27, 0.55], [0.15, 0.6]], 26), steel, 0, 1.05, 0, torso);
  plate.scale.z = 0.78;
  // Tabard hangs over the breastplate: front and back panels with a gold edge, and a gold cross on the chest
  for (const side of [-1, 1]) {
    const panel = add(new THREE.PlaneGeometry(0.42, 0.78), team, 0, 1.07, side * 0.255, torso);
    if (side > 0) panel.rotation.y = Math.PI;
  }
  add(new THREE.BoxGeometry(0.06, 0.26, 0.012), gold, 0, 1.25, -0.262, torso);
  add(new THREE.BoxGeometry(0.2, 0.05, 0.012), gold, 0, 1.3, -0.262, torso);
  add(new THREE.TorusGeometry(0.3, 0.03, 8, 30), leather, 0, 0.92, 0, torso).rotation.x = Math.PI / 2;
  add(new THREE.BoxGeometry(0.1, 0.08, 0.03), gold, 0, 0.92, -0.25, torso);
  // Steel skirt plates over the hips
  add(latheOf([[0.33, 0], [0.31, 0.08], [0.3, 0.1]], 22), worn, 0, 0.78, 0, torso).scale.z = 0.85;
  // Neck guard
  add(new THREE.CylinderGeometry(0.15, 0.19, 0.1, 18), worn, 0, 1.62, 0, torso);
  // Layered shoulder plates with gold rims
  for (const side of [-1, 1]) {
    const pauldron = add(new THREE.SphereGeometry(0.19, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), steel, side * 0.36, 1.55, 0, torso);
    pauldron.scale.set(1.05, 0.8, 1);
    add(new THREE.TorusGeometry(0.17, 0.012, 6, 20), gold, side * 0.36, 1.5, 0, torso).rotation.x = Math.PI / 2;
    add(new THREE.SphereGeometry(0.15, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.5), worn, side * 0.39, 1.43, 0, torso).scale.y = 0.7;
  }

  // Great helm: a steel pot with a slightly domed top, eye slits, breathing holes, gold cross and a plume
  const head = new THREE.Group();
  head.position.y = 1.66;
  knight.add(head);
  add(latheOf([[0.19, 0], [0.215, 0.03], [0.225, 0.18], [0.22, 0.3], [0.19, 0.36], [0.11, 0.4], [0, 0.415]], 28), steel, 0, 0, 0, head).scale.z = 1.05;
  add(new THREE.BoxGeometry(0.32, 0.026, 0.06), black, 0, 0.22, -0.21, head);
  add(new THREE.BoxGeometry(0.035, 0.24, 0.02), gold, 0, 0.15, -0.233, head);
  add(new THREE.BoxGeometry(0.34, 0.03, 0.02), gold, 0, 0.255, -0.225, head);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    add(new THREE.BoxGeometry(0.018, 0.018, 0.03), black, 0.07 + c * 0.035, 0.06 + r * 0.035, -0.218, head);
  }
  const plumeCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0.4, -0.02), new THREE.Vector3(0, 0.56, 0.06), new THREE.Vector3(0, 0.58, 0.22),
    new THREE.Vector3(0, 0.45, 0.38), new THREE.Vector3(0, 0.25, 0.45)
  ]);
  add(new THREE.TubeGeometry(plumeCurve, 20, 0.055, 8), team, 0, 0, 0, head);
  add(new THREE.TubeGeometry(plumeCurve, 20, 0.035, 6), team, 0.04, 0.02, 0, head);
  add(new THREE.TubeGeometry(plumeCurve, 20, 0.035, 6), team, -0.04, 0.02, 0, head);

  // Cape: a cloth with many rows of points, so it can wave
  const capeGeometry = new THREE.PlaneGeometry(0.6, 1.15, 1, 10);
  capeGeometry.translate(0, -0.575, 0);
  const cape = add(capeGeometry, team, 0, 1.6, 0.27, knight);
  cape.userData.rest = capeGeometry.attributes.position.array.slice();

  // Arms: shoulder → upper arm (chain mail) → elbow cop → steel forearm → gauntlet
  const makeArm = side => {
    const shoulder = new THREE.Group();
    shoulder.position.set(side * 0.4, 1.5, 0);
    knight.add(shoulder);
    add(new THREE.CylinderGeometry(0.075, 0.07, 0.3, 10), mail, 0, -0.15, 0, shoulder);
    const elbow = new THREE.Group();
    elbow.position.y = -0.3;
    shoulder.add(elbow);
    add(new THREE.SphereGeometry(0.075, 10, 8), steel, 0, 0, 0, elbow);
    add(latheOf([[0.065, -0.26], [0.075, -0.15], [0.07, 0]], 12), steel, 0, 0, 0, elbow);
    const hand = new THREE.Group();
    hand.position.y = -0.3;
    elbow.add(hand);
    add(new THREE.BoxGeometry(0.1, 0.1, 0.12), worn, 0, 0, 0, hand);
    return { shoulder, elbow, hand };
  };
  const swordArm = makeArm(1);
  const shieldArm = makeArm(-1);
  shieldArm.shoulder.rotation.x = 0.5;
  shieldArm.elbow.rotation.x = 1.1;
  const sword = makeSword(steel, gold, leather);
  sword.rotation.x = -0.78;   // points the blade forward and a bit up when the arm is resting
  swordArm.hand.add(sword);

  // Kite shield in the team color with a steel rim and a gold cross, held in front on the left
  const shield = new THREE.Group();
  shield.position.set(-0.45, 1.15, -0.32);
  shield.rotation.y = 0.35;
  knight.add(shield);
  const rim = add(kiteShieldGeometry(1.08), worn, 0, 0, 0, shield);
  rim.position.z = 0.015;
  add(kiteShieldGeometry(1), team, 0, 0, -0.01, shield);
  add(new THREE.BoxGeometry(0.06, 0.55, 0.02), gold, 0, -0.05, -0.04, shield);
  add(new THREE.BoxGeometry(0.42, 0.06, 0.02), gold, 0, 0.1, -0.04, shield);
  shield.rotation.z = Math.PI;   // the pointed end goes down

  knight.userData = { legL, legR, swordArm, cape, head, torso };
  scene.add(knight);
  return knight;
}

// The sword and steel glove you see in your own hand, at the bottom right of your view
function makeViewSword(camera, layer) {
  const holder = new THREE.Group();
  const steel = new THREE.MeshStandardMaterial({ color: "#c9cfd6", roughness: 0.25, metalness: 1 });
  const gold = new THREE.MeshStandardMaterial({ color: "#e3b341", roughness: 0.25, metalness: 1 });
  const leather = new THREE.MeshStandardMaterial({ color: "#3d2616", roughness: 0.8 });

  glove.position.y = -0.01;
  holder.add(sword, glove);
  holder.position.set(0.19, -0.25, -0.58);
  holder.rotation.set(-0.85, -0.25, -0.2);   // blade points forward and a little up
  holder.traverse(o => o.layers.set(layer));

}

// ---------- Soldiers (modern mode) ----------
function camoTextures() {
  const s = 256, rand = seeded(55);
  const [color, cg] = makeCanvas(s);
  const [height, hg] = makeCanvas(s);
  cg.fillStyle = "#6b6a45";
  cg.fillRect(0, 0, s, s);
  // Blobs of olive, brown, black and sand: woodland camouflage
  for (const [c, n] of [["#4a5230", 40], ["#6a5235", 30], ["#2b2d22", 25], ["#9b8f63", 15]]) {
    cg.fillStyle = c;
    for (let i = 0; i < n; i++) {
      cg.beginPath();
      cg.ellipse(rand() * s, rand() * s, 8 + rand() * 20, 5 + rand() * 12, rand() * Math.PI, 0, Math.PI * 2);
      cg.fill();
    }
  }
  // Fabric weave for the normal map
  hg.fillStyle = "#808080";
  hg.fillRect(0, 0, s, s);
  for (let i = 0; i < s; i += 3) {
    hg.fillStyle = "rgba(255, 255, 255, 0.35)";
    hg.fillRect(i, 0, 1, s);
    hg.fillStyle = "rgba(0, 0, 0, 0.35)";
    hg.fillRect(0, i, s, 1);
  }
  return { map: toTexture(color, true), normalMap: toTexture(normalFromHeight(height, 1.5), false) };
}
const CAMO = CASTLE ? null : camoTextures();

// A modern assault rifle, pointing along -Z with the grip at the origin
function makeRifle() {
  const rifle = new THREE.Group();
  const metal = new THREE.MeshStandardMaterial({ color: "#2b2d30", roughness: 0.4, metalness: 0.85 });
  const polymer = new THREE.MeshStandardMaterial({ color: "#1c1d1f", roughness: 0.65 });
  const tan = new THREE.MeshStandardMaterial({ color: "#8a7a5a", roughness: 0.7 });
  const lens = new THREE.MeshStandardMaterial({ color: "#16242f", roughness: 0.05, metalness: 1 });
  const part = (geometry, material, x, y, z, rotX = 0) => {
    const m = new THREE.Mesh(geometry, material);
    m.position.set(x, y, z);
    m.rotation.x = rotX;
    m.castShadow = true;
    rifle.add(m);
    return m;
  };
  part(new THREE.BoxGeometry(0.055, 0.085, 0.4), metal, 0, 0.04, -0.06);                         // receiver
  part(new THREE.BoxGeometry(0.03, 0.02, 0.36), metal, 0, 0.095, -0.08);                         // rail on top
  part(new THREE.BoxGeometry(0.065, 0.07, 0.26), tan, 0, 0.035, -0.37);                          // handguard
  part(new THREE.CylinderGeometry(0.012, 0.012, 0.3, 10), metal, 0, 0.045, -0.6, Math.PI / 2);  // barrel
  part(new THREE.CylinderGeometry(0.02, 0.018, 0.07, 10), metal, 0, 0.045, -0.77, Math.PI / 2); // muzzle brake
  part(new THREE.BoxGeometry(0.035, 0.16, 0.07), polymer, 0, -0.08, -0.13, 0.25);              // magazine
  part(new THREE.BoxGeometry(0.035, 0.1, 0.045), polymer, 0, -0.05, 0.07, -0.35);              // pistol grip
  part(new THREE.BoxGeometry(0.05, 0.08, 0.24), tan, 0, 0.02, 0.26);                              // stock
  part(new THREE.CylinderGeometry(0.024, 0.024, 0.15, 12), metal, 0, 0.13, -0.08, Math.PI / 2);  // scope
  part(new THREE.CylinderGeometry(0.022, 0.022, 0.005, 12), lens, 0, 0.13, -0.158, Math.PI / 2);
  // Where bullets and the muzzle flash come out
  const muzzle = new THREE.Object3D();
  muzzle.position.set(0, 0.045, -0.82);
  rifle.add(muzzle);
  rifle.userData.muzzle = muzzle;
  return rifle;
}

// A star-shaped flash, drawn in code
function flashTexture() {
  const [c, g] = makeCanvas(64);
  const glow = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  glow.addColorStop(0, "rgba(255, 250, 220, 1)");
  glow.addColorStop(0.3, "rgba(255, 190, 80, 0.9)");
  glow.addColorStop(1, "rgba(255, 120, 0, 0)");
  g.fillStyle = glow;
  g.beginPath();
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2, r = i % 2 ? 12 : 32;
    g.lineTo(32 + Math.cos(a) * r, 32 + Math.sin(a) * r);
  }
  g.fill();
  return toTexture(c, true);
}
const FLASH = CASTLE ? null : flashTexture();

function addMuzzleFlash(rifle, size) {
  const flash = new THREE.Sprite(new THREE.SpriteMaterial({ map: FLASH, color: new THREE.Color(3, 2.4, 1.4), transparent: true,
                                                            depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
  flash.scale.setScalar(size);
  flash.visible = false;
  rifle.userData.muzzle.add(flash);
  return flash;
}

function makeSoldier(color) {
  const soldier = new THREE.Group();
  soldier.rotation.order = "YXZ";   // turn first, then fall over (when dying)
  const camo = new THREE.MeshStandardMaterial({ map: CAMO.map, normalMap: CAMO.normalMap, roughness: 0.95 });
  const vest = new THREE.MeshStandardMaterial({ color: "#4b4f31", roughness: 0.9 });
  const gear = new THREE.MeshStandardMaterial({ color: "#35372a", roughness: 0.85 });
  const helmetMat = new THREE.MeshStandardMaterial({ map: CAMO.map, color: "#9a9a80", roughness: 0.8 });
  const team = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
  const dark = new THREE.MeshStandardMaterial({ color: "#1f1e1c", roughness: 0.9 });
  const glass = new THREE.MeshStandardMaterial({ color: "#0b0e12", roughness: 0.03, metalness: 1 });
  const add = (geometry, material, x, y, z, parent = soldier) => {
    const m = new THREE.Mesh(geometry, material);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  };
  // Legs: camo trousers, knee pads, boots. The knee bends when walking.
  const makeLeg = x => {
    const hip = new THREE.Group();
    hip.position.set(x, 0.92, 0);
    soldier.add(hip);
    add(new THREE.CylinderGeometry(0.115, 0.1, 0.46, 12), camo, 0, -0.23, 0, hip);
    const knee = new THREE.Group();
    knee.position.y = -0.46;
    hip.add(knee);
    add(new THREE.BoxGeometry(0.13, 0.13, 0.05), dark, 0, 0, -0.09, knee);
    add(new THREE.CylinderGeometry(0.095, 0.085, 0.38, 12), camo, 0, -0.19, 0, knee);
    add(new THREE.BoxGeometry(0.14, 0.12, 0.29), dark, 0, -0.41, -0.04, knee);
    return { hip, knee };
  };
  const legL = makeLeg(-0.13);
  const legR = makeLeg(0.13);

  // Upper body turns as one piece (so it can lean when looking up and down)
  const upper = new THREE.Group();
  upper.position.y = 0.92;
  soldier.add(upper);
  add(new THREE.CylinderGeometry(0.27, 0.24, 0.62, 16), camo, 0, 0.3, 0, upper);
  add(new THREE.BoxGeometry(0.56, 0.48, 0.36), vest, 0, 0.34, 0, upper);          // plate carrier vest
  for (const x of [-0.15, 0, 0.15]) add(new THREE.BoxGeometry(0.12, 0.15, 0.07), gear, x, 0.2, -0.2, upper);   // magazine pouches
  add(new THREE.BoxGeometry(0.2, 0.25, 0.1), gear, 0.05, 0.4, 0.22, upper);       // radio on the back
  add(new THREE.CylinderGeometry(0.008, 0.008, 0.5), dark, 0.12, 0.7, 0.24, upper);   // its aerial
  add(new THREE.TorusGeometry(0.255, 0.035, 8, 24), gear, 0, 0.02, 0, upper).rotation.x = Math.PI / 2;   // belt
  for (const side of [-1, 1]) {
    add(new THREE.BoxGeometry(0.02, 0.1, 0.12), team, side * 0.29, 0.5, 0, upper);   // team patch on each shoulder
  }

  // Head: dark balaclava, ballistic glasses, a camo helmet with a team-colored band
  const head = new THREE.Group();
  head.position.y = 0.72;
  upper.add(head);
  add(new THREE.CylinderGeometry(0.09, 0.1, 0.1, 12), dark, 0, 0, 0, head);      // neck
  add(new THREE.SphereGeometry(0.135, 16, 12), dark, 0, 0.12, 0, head);
  add(new THREE.BoxGeometry(0.21, 0.05, 0.04), glass, 0, 0.14, -0.12, head);
  const helmet = add(new THREE.SphereGeometry(0.175, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), helmetMat, 0, 0.16, 0.01, head);
  helmet.scale.set(1, 0.95, 1.1);
  add(new THREE.TorusGeometry(0.17, 0.018, 6, 24), team, 0, 0.18, 0.01, head).rotation.x = Math.PI / 2;
  add(new THREE.BoxGeometry(0.08, 0.05, 0.03), dark, 0, 0.26, -0.17, head);      // night vision mount

  // Arms reaching from the shoulders to the rifle: the right hand on the grip, the left under the barrel
  const arm = (x, hand) => {
    const shoulder = new THREE.Group();
    shoulder.position.set(x, 0.58, 0);
    const reach = hand.clone().sub(shoulder.position);
    const length = reach.length();
    shoulder.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), reach.normalize());
    upper.add(shoulder);
    add(new THREE.CylinderGeometry(0.075, 0.062, length, 10), camo, 0, -length / 2, 0, shoulder);
    add(new THREE.SphereGeometry(0.06, 10, 8), dark, 0, -length, 0, shoulder);   // glove
    return shoulder;
  };
  arm(0.27, new THREE.Vector3(0.14, 0.38, -0.16));
  arm(-0.27, new THREE.Vector3(0.1, 0.44, -0.58));
  const rifle = makeRifle();
  rifle.position.set(0.12, 0.42, -0.22);
  upper.add(rifle);
  const flash = addMuzzleFlash(rifle, 0.5);

  soldier.userData = { legL, legR, upper, head, rifle, flash };
  scene.add(soldier);
  return soldier;
}

// The rifle and gloves you see in your own view, with a muzzle flash and its light
function makeViewRifle(camera, layer) {
  const holder = new THREE.Group();
  const rifle = makeRifle();
  holder.add(rifle);
  const glove = new THREE.MeshStandardMaterial({ color: "#2a2826", roughness: 0.9 });
  const camo = new THREE.MeshStandardMaterial({ map: CAMO.map, roughness: 0.95 });
  const hand = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 0.09), glove);
  hand.position.set(0, -0.06, 0.06);
  const hand2 = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.06, 0.1), glove);
  hand2.position.set(0, -0.01, -0.38);
  const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.3, 10), camo);
  sleeve.rotation.x = Math.PI / 2.4;
  sleeve.position.set(0.02, -0.14, 0.22);
  holder.add(hand, hand2, sleeve);
  const flash = addMuzzleFlash(rifle, 0.35);
  const flashLight = new THREE.PointLight("#ffb060", 0, 6, 1.5);
  rifle.userData.muzzle.add(flashLight);
  holder.scale.setScalar(0.6);
  holder.position.set(0.12, -0.13, -0.3);
  holder.userData = { flash, flashLight };
  holder.traverse(o => o.layers.set(layer));
  camera.add(holder);
  return holder;
}

function forwardOf(p) {
  return { x: -Math.sin(p.yaw), z: -Math.cos(p.yaw) };
}

                0.05 + Math.random() * 0.05, Math.random() < 0.5 ? "#ffd27a" : "#ff6a00", 0.5 + Math.random() * 0.5, 12);
